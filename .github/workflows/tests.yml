name: Tests

on:
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v6
        with:
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Test local R2 and D1 publication and recovery
        run: npm test -- --integration
      - name: Check website deployment package
        run: node scripts/cloudflare.mjs check
