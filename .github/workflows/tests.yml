name: Tests

on:
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_call:

permissions:
  contents: read

jobs:
  windows-map-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/map-package.test.mjs
      - run: npm run maps:pack

  map-exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/map-export/requirements.txt
      - run: python -m pip install -r scripts/map-export/requirements.txt
      - run: python tests/map-export.test.py
      - run: python tests/map-export-links.test.py

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v6
        with:
          path: core
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build reusable map package
        run: npm run maps:pack
      - name: Save versioned map package
        uses: actions/upload-artifact@v4
        with:
          name: taelgar-maps
          path: core/.cache/packages/taelgar-maps-*.tgz
          if-no-files-found: error
          include-hidden-files: true
      - name: Test local R2 and D1 publication and recovery
        run: npm test -- --integration
      - name: Check website deployment package
        run: node scripts/cloudflare.mjs check
