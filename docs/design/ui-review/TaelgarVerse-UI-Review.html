/qCmBIsdHW5B0nAX512xkqu8oWItvECysUyhCbwfRYlyJvkq4DoYl8TeZAIO/AI+G4u3eM6vE+40qOkdDVE5n6tbDMvGS5FjXMIrpM/rdmA+jg/HlOH/H0n/UbH4BIRZa9nivV++Im4hcYYEmYa7/a/bfIbEGAavjiURNH5ug5CV4Bm/ppp2z8le5JVvCcGWNeW3C+0Jx8IMtQC3o6mvT2ct+MOV1+IaeJPDu6Ns6cWsEsIAhuz9PjqwEGW+va6EMNGmlBPOSlLIMQcs3unH9n+JiGQPwT1sGmGPRyIeXUKFcn3oZpCDlK7jw1Ydw/UNefmKAVCo95i8OYp9gG8U3lvAeV936+TxoWt4gmbURA3KDS9DBkVzruEz4BJpvV2wxxkR+GSxCDVGzHRXah/87lE5FiNFwDlMj6eTcjLUY2euqjv5H1hb3G6s6mjRSYq3eIDAgMwpJX+2XKX7Fp77f4kBTjOA5AwwN/U1XPKfJuYUZvIuq9NPFcmKxt18j8Ozqxyid5Kxl01wbXpmlQASRAik3q1dl2z9sFeRImCPoJxWaZcbqw1UHubSuywtgDsSUatEzQEthlVXnlDiBEKb5LnzRufYbMkDoActXp/qxJ5gkckGVbo66cQYMlcdzPBi8TR0hxa5+S6IGkVijfUOaaZuEIfkRUNV5QYed7k+nm/KB7mAIaBBuGAByfCAAAA\&quot; alt=\&quot;Dufr 120 Emberwine Party\&quot;&gt;\u003c/p&gt;\n\u003cp&gt;Drifting through the crowd, the party meets \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Lord Soven\u003c/span&gt; himself, a seven-foot-tall figure with antlered head, who invites \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Delwath\u003c/span&gt; to dance while they speak. When Delwath mentions Cloudspinner’s imprisonment, Lord Soven falters noticeably, shocked: “None of us ever thought the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cloudspinner\u003c/span&gt; could return,” he admits.\u003c/p&gt;\n\u003cp&gt;As the party splits up to gather information, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt; meditates at the periphery, connecting with the natural world. Unlike his typical experiences, he’s overwhelmed by emotions pouring from every vine and fruit—pleasure and sweetness, but with troubling undertones of overripeness, as though the land strains to maintain this celebration.\u003c/p&gt;\n\u003cp&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Wellby\u003c/span&gt;, moving through the crowds looking for someone out of place, encounters \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Valeris\u003c/span&gt;, a satyr cursed to speak only brutal truth after helping a fey woman escape an oath. Valeris reveals the deterioration of the Feywild following Cloudspinner’s disappearance and mentions the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Shrouded Archive\u003c/span&gt; where all secrets are kept, as well as \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Count Vashan\u003c/span&gt;, a member of Cloudspinner’s court now lost in drink in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Emberwine\u003c/span&gt;.\u003c/p&gt;\n\u003cp&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Riswynn\u003c/span&gt; befriends \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ismara\u003c/span&gt; of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Gleamwater\u003c/span&gt;, a scholar of humanity eager to document the party’s adventures. From \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ismara\u003c/span&gt;, the party hears about \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Amberglow\u003c/span&gt;: the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cloud Palace\u003c/span&gt; with its six towers, now crashed; \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Redsun Watch\u003c/span&gt; standing before a crystallized \u003cspan class=\&quot;tv-crosslink\&quot;&gt;wall of sunset colors\u003c/span&gt;; \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Heartwood Grove\u003c/span&gt;, now dark and rotting; and the northern outposts of Amberglow overtaken by the mysterious \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Gloomshaper\u003c/span&gt;.\u003c/p&gt;\n\u003cp&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Delwath\u003c/span&gt; meets \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Arendel\u003c/span&gt;, a renowned but cheerful and friendly duelist who challenges him on the spot. Their duel draws a crowd, including drawing back other members of the party who had wandered off. \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Arendel\u003c/span&gt; ultimately wins but acknowledges Delwath’s skill. As payment, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Delwath\u003c/span&gt; must entertain \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Arendel\u003c/span&gt; with stories for two days.\u003c/p&gt;\n\u003cp&gt;After the duel, the goes to find \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Count Vashan\u003c/span&gt;, who is now calling himself “the broken mask”. He is slumped at the edge of festivities, clearly deep in drink. \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Delwath\u003c/span&gt; boldly declares that \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cloudspinner\u003c/span&gt; is alive, and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Lady Eventide\u003c/span&gt; recognizes Vashan as one of Cloudspinner’s most trusted servants, but the Count does not deign to speak of the past. Suspecting the fey wine is clouding his memories, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt; channels his ki to temporarily suppress the magic afflicting Vashan’s mind, jolting him to awareness of his past.\u003c/p&gt;\n\u003cp&gt;The effect is immediate. \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Count Vashan\u003c/span&gt;’s eyes clear as the truth emerges: he betrayed \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cloudspinner\u003c/span&gt;, bringing \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cha’mutte\u003c/span&gt; to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cloud Palace\u003c/span&gt; during a moment of vulnerability, though whether intentionally or by accident, he can no longer remember. Though ashamed and angry, he offers crucial information: each of the keeps along the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sunset Gate\u003c/span&gt; contain hidden chambers allowing them to connect to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Prismwell\u003c/span&gt;, once used as a means of communication, defense, and perhaps more–\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Count Vashan\u003c/span&gt; does not know. However, the connection to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Prismwell\u003c/span&gt; can only be activated by the light of pure sunset.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:21,&quot;title&quot;:&quot;Detailed Outline&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;detailed-outline\&quot;&gt;Detailed Outline\u003c/h2&gt;\n\u003ch3 id=\&quot;reaching-sunwine-hall\&quot;&gt;Reaching Sunwine Hall\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party arrives in the fey realm of Emberwine, following a flute given by \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Auntie Mulberry\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;They’re seeking a refugee from Amber Glow who might be at Lord Sovin’s court.\u003c/li&gt;\n\u003cli&gt;Lady Eventide (possessing Seeker) provides background on Lord Sovin.\u003c/li&gt;\n\u003cli&gt;The group approaches Sunwine Hall, an open-air feast with perpetual late afternoon light.\u003c/li&gt;\n\u003cli&gt;They observe the revels, noticing a flow pulling people into the great stone pavilion.\u003c/li&gt;\n\u003cli&gt;An elegantly dressed man welcomes them to the feast, offering food and wine.\u003c/li&gt;\n\u003cli&gt;They navigate through the party, with Wellby using his natural talent for adapting to social customs.\u003c/li&gt;\n\u003cli&gt;Kenzo senses an undercurrent of collective avoidance beneath the revelry.\u003c/li&gt;\n\u003cli&gt;They encounter Lord Sovin, a tall figure with antlers and ribbons, who welcomes them warmly.\u003c/li&gt;\n\u003cli&gt;Delwath mentions their burden regarding Cloud Spinner’s imprisonment, causing concern in Lord Sovin.\u003c/li&gt;\n\u003cli&gt;Lord Sovin is surprised and awed when they mention finding Cloud Spinner.\u003c/li&gt;\n\u003cli&gt;Kenzo performs a commune with nature to search for anomalies related to the Prism Well.\u003c/li&gt;\n\u003cli&gt;Riswynn mingles with party guests, gathering information about the Feywild.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3 id=\&quot;meditations-on-the-feywild\&quot;&gt;Meditations on the Feywild\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;Kenzo separates from the group and moves to the edge of the party near one of the smaller bands.\u003c/li&gt;\n\u003cli&gt;He attempts to commune with nature, something he has never done in the Feywild before.\u003c/li&gt;\n\u003cli&gt;Instead of sensing plants and animals as he normally would, Kenzo experiences a riot of emotions emanating from the vegetation.\u003c/li&gt;\n\u003cli&gt;The vines and plants are bursting with pleasure and sweetness, their emotions shifting in response to the party’s moods.\u003c/li&gt;\n\u003cli&gt;His communion produces sensory experiences like tasting the sweetness of a ripe peach.\u003c/li&gt;\n\u003cli&gt;As his awareness extends outward, Kenzo notices some plants feel “overripe” or strained, reflecting the undercurrent of the revelers trying too hard to party.\u003c/li&gt;\n\u003cli&gt;When asked about anomalies, Kenzo senses the Red River (river of wine) where plants along its banks sway from intoxication rather than from any breeze.\u003c/li&gt;\n\u003cli&gt;Despite the strange nature of his communion, Kenzo finds no true anomalies in the surrounding area.\u003c/li&gt;\n\u003cli&gt;Kenzo decides to remain at the edge of the celebration, not feeling in a festive mood himself.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3 id=\&quot;wellby-meets-valeris\&quot;&gt;Wellby Meets Valeris\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;Wellby explores the party looking for interesting characters or anyone who doesn’t quite belong.\u003c/li&gt;\n\u003cli&gt;He notices a satyr sitting alone, looking unhappy - unusual for the festive atmosphere.\u003c/li&gt;\n\u003cli&gt;The satyr reveals he’s cursed to tell only brutal, complete truth, making social interactions difficult.\u003c/li&gt;\n\u003cli&gt;He explains he gained this curse after helping a fey woman named Yasara the Golden escape an oath she made.\u003c/li&gt;\n\u003cli&gt;The satyr mentions he could be freed by performing one selfless act, but his previous attempts haven’t worked.\u003c/li&gt;\n\u003cli&gt;When Wellby inquires about a refugee from Amberglow, the satyr calls him “the broken mask” and says he can be found wherever the strongest wine is served.\u003c/li&gt;\n\u003cli&gt;The satyr admits that the Feywild has deteriorated since Cloud Spinner vanished.\u003c/li&gt;\n\u003cli&gt;Wellby learns about the Shrouded Archive, where all the Feywild’s secrets are kept, but accessing it requires paying an unknown “tax” or toll.\u003c/li&gt;\n\u003cli&gt;The satyr laments his boring existence at the revels, unable to play games, tell embellished stories, or engage normally.\u003c/li&gt;\n\u003cli&gt;Wellby begins telling the satyr a true story about stopping an emperor from becoming a god.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:22,&quot;title&quot;:&quot;Reaching Sunwine Hall&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;reaching-sunwine-hall\&quot;&gt;Reaching Sunwine Hall\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party arrives in the fey realm of Emberwine, following a flute given by \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Auntie Mulberry\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;They’re seeking a refugee from Amber Glow who might be at Lord Sovin’s court.\u003c/li&gt;\n\u003cli&gt;Lady Eventide (possessing Seeker) provides background on Lord Sovin.\u003c/li&gt;\n\u003cli&gt;The group approaches Sunwine Hall, an open-air feast with perpetual late afternoon light.\u003c/li&gt;\n\u003cli&gt;They observe the revels, noticing a flow pulling people into the great stone pavilion.\u003c/li&gt;\n\u003cli&gt;An elegantly dressed man welcomes them to the feast, offering food and wine.\u003c/li&gt;\n\u003cli&gt;They navigate through the party, with Wellby using his natural talent for adapting to social customs.\u003c/li&gt;\n\u003cli&gt;Kenzo senses an undercurrent of collective avoidance beneath the revelry.\u003c/li&gt;\n\u003cli&gt;They encounter Lord Sovin, a tall figure with antlers and ribbons, who welcomes them warmly.\u003c/li&gt;\n\u003cli&gt;Delwath mentions their burden regarding Cloud Spinner’s imprisonment, causing concern in Lord Sovin.\u003c/li&gt;\n\u003cli&gt;Lord Sovin is surprised and awed when they mention finding Cloud Spinner.\u003c/li&gt;\n\u003cli&gt;Kenzo performs a commune with nature to search for anomalies related to the Prism Well.\u003c/li&gt;\n\u003cli&gt;Riswynn mingles with party guests, gathering information about the Feywild.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:24,&quot;title&quot;:&quot;Meditations on the Feywild&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;meditations-on-the-feywild\&quot;&gt;Meditations on the Feywild\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;Kenzo separates from the group and moves to the edge of the party near one of the smaller bands.\u003c/li&gt;\n\u003cli&gt;He attempts to commune with nature, something he has never done in the Feywild before.\u003c/li&gt;\n\u003cli&gt;Instead of sensing plants and animals as he normally would, Kenzo experiences a riot of emotions emanating from the vegetation.\u003c/li&gt;\n\u003cli&gt;The vines and plants are bursting with pleasure and sweetness, their emotions shifting in response to the party’s moods.\u003c/li&gt;\n\u003cli&gt;His communion produces sensory experiences like tasting the sweetness of a ripe peach.\u003c/li&gt;\n\u003cli&gt;As his awareness extends outward, Kenzo notices some plants feel “overripe” or strained, reflecting the undercurrent of the revelers trying too hard to party.\u003c/li&gt;\n\u003cli&gt;When asked about anomalies, Kenzo senses the Red River (river of wine) where plants along its banks sway from intoxication rather than from any breeze.\u003c/li&gt;\n\u003cli&gt;Despite the strange nature of his communion, Kenzo finds no true anomalies in the surrounding area.\u003c/li&gt;\n\u003cli&gt;Kenzo decides to remain at the edge of the celebration, not feeling in a festive mood himself.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:26,&quot;title&quot;:&quot;Wellby Meets Valeris&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;wellby-meets-valeris\&quot;&gt;Wellby Meets Valeris\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;Wellby explores the party looking for interesting characters or anyone who doesn’t quite belong.\u003c/li&gt;\n\u003cli&gt;He notices a satyr sitting alone, looking unhappy - unusual for the festive atmosphere.\u003c/li&gt;\n\u003cli&gt;The satyr reveals he’s cursed to tell only brutal, complete truth, making social interactions difficult.\u003c/li&gt;\n\u003cli&gt;He explains he gained this curse after helping a fey woman named Yasara the Golden escape an oath she made.\u003c/li&gt;\n\u003cli&gt;The satyr mentions he could be freed by performing one selfless act, but his previous attempts haven’t worked.\u003c/li&gt;\n\u003cli&gt;When Wellby inquires about a refugee from Amberglow, the satyr calls him “the broken mask” and says he can be found wherever the strongest wine is served.\u003c/li&gt;\n\u003cli&gt;The satyr admits that the Feywild has deteriorated since Cloud Spinner vanished.\u003c/li&gt;\n\u003cli&gt;Wellby learns about the Shrouded Archive, where all the Feywild’s secrets are kept, but accessing it requires paying an unknown “tax” or toll.\u003c/li&gt;\n\u003cli&gt;The satyr laments his boring existence at the revels, unable to play games, tell embellished stories, or engage normally.\u003c/li&gt;\n\u003cli&gt;Wellby begins telling the satyr a true story about stopping an emperor from becoming a god.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:28,&quot;title&quot;:&quot;Delwath Meets Arendell&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;delwath-meets-arendell\&quot;&gt;Delwath Meets Arendell\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;Delwath wanders the revels, drawing attention with his martial bearing.\u003c/li&gt;\n\u003cli&gt;Arendel, a boisterous fey warrior with golden hair and a dented breastplate, approaches Delwath.\u003c/li&gt;\n\u003cli&gt;Arendel is known as a duelist who has faced many challengers at Lord Sovin’s court.\u003c/li&gt;\n\u003cli&gt;He notices and comments on Delwath’s elven blade.\u003c/li&gt;\n\u003cli&gt;Arendel expresses his philosophy that the best duels are between friends, not enemies.\u003c/li&gt;\n\u003cli&gt;He challenges Delwath to a friendly duel.\u003c/li&gt;\n\u003cli&gt;They negotiate the terms: to first blood, minimal magic allowed (“one spell each”).\u003c/li&gt;\n\u003cli&gt;The stakes are set: the loser must entertain the winner with stories for one day.\u003c/li&gt;\n\u003cli&gt;Arendel bangs his sword against his cup, announcing the duel to the revelers.\u003c/li&gt;\n\u003cli&gt;Word of the upcoming duel spreads through the feast, generating excitement.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:30,&quot;title&quot;:&quot;Delwath’s Duel&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;delwaths-duel\&quot;&gt;Delwath’s Duel\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;Riswynn meets Ismara of Gleamwater, a fey woman with a book who is documenting travelers.\u003c/li&gt;\n\u003cli&gt;Ismara is intrigued by Riswynn’s tales of a flying castle and their journey through the wasteland.\u003c/li&gt;\n\u003cli&gt;Word spreads of the upcoming duel between Delwath and Arendel, attracting everyone’s attention.\u003c/li&gt;\n\u003cli&gt;Valeris (the truth-telling satyr) tells Wellby that Arendel rarely loses duels.\u003c/li&gt;\n\u003cli&gt;The duel begins with formal rules: first to inflict half damage wins, and each duelist may use one spell.\u003c/li&gt;\n\u003cli&gt;Delwath invokes the gods’ guidance while Arendel uses Shield to deflect attacks.\u003c/li&gt;\n\u003cli&gt;The fight is intense and close, with Delwath landing powerful strikes but ultimately losing.\u003c/li&gt;\n\u003cli&gt;Arendel acknowledges Delwath’s skill, saying it was the closest he’d come to defeat in a long time.\u003c/li&gt;\n\u003cli&gt;Arendel looks forward to hearing Delwath’s stories as the promised reward for winning.\u003c/li&gt;\n\u003cli&gt;The duel ends with a toast to the travelers and even to “annoying satyrs” like Valeris.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:32,&quot;title&quot;:&quot;Conversation and Stories&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;conversation-and-stories\&quot;&gt;Conversation and Stories\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;After the duel, Arendel invites Delwath to share his tales with the gathering crowd.\u003c/li&gt;\n\u003cli&gt;Delwath begins by telling the story of how he acquired his blade, followed by tales of dragon-slaying.\u003c/li&gt;\n\u003cli&gt;Arendel eventually excuses himself to get refreshments, promising to return for more stories.\u003c/li&gt;\n\u003cli&gt;While Arendel is away, the party regroups with Valeris (the truth-telling satyr) and Ismara still present.\u003c/li&gt;\n\u003cli&gt;Riswynn approaches Ismara to inquire about Everlight’s Bloom and the Shrouded Archive.\u003c/li&gt;\n\u003cli&gt;Ismara cautions about the mysterious “toll” required at the Shrouded Archive.\u003c/li&gt;\n\u003cli&gt;Using her magical book, Ismara shares information about Amberglow, conjuring images of:\n\u003cul&gt;\n\u003cli&gt;The Cloud Palace with its six towers\u003c/li&gt;\n\u003cli&gt;Red Sun Keep with its glowing red castle near the Sunset Gate\u003c/li&gt;\n\u003cli&gt;The archive where many of Cloud Spinner’s stories were stored\u003c/li&gt;\n\u003cli&gt;Artwood Grove, now rotting after its guardian was killed\u003c/li&gt;\n\u003cli&gt;The northern regions overtaken by the Gloom Shaper\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;The party discusses the possibility that Red Sun Keep might be overrun by Harrow and Wend.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:34,&quot;title&quot;:&quot;Recruiting Allies and Planning the Next Move&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;recruiting-allies-and-planning-the-next-move\&quot;&gt;Recruiting Allies and Planning the Next Move\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party discusses whether certain members have previously visited Amberglow, confirming that neither Riswynn nor Delwath have been there.\u003c/li&gt;\n\u003cli&gt;They debate whether to recruit Ismara (the book-carrying fey) or Valeris (the truth-telling satyr) for their journey.\u003c/li&gt;\n\u003cli&gt;The group decides to seek out “the broken mask,” the melancholy refugee from Amberglow, before departing.\u003c/li&gt;\n\u003cli&gt;Ismara expresses interest in staying to hear Delwath’s stories while he fulfills his promise to Arendel.\u003c/li&gt;\n\u003cli&gt;She reveals she collects tales of the mortal world, fascinated by its strange predictability and decay.\u003c/li&gt;\n\u003cli&gt;Ismara mentions her plans to travel to the Sunset Gate but fears going beyond it due to dangers.\u003c/li&gt;\n\u003cli&gt;She provides information about Dusk Mire, the realm of the Gloom Shaper, and the difficulties of reaching Twilight’s Grace.\u003c/li&gt;\n\u003cli&gt;Riswynn decides to search for the melancholy refugee from Amberglow, with Delwath joining her.\u003c/li&gt;\n\u003cli&gt;Wellby formally invites Valeris to accompany them to the Shrouded Archive.\u003c/li&gt;\n\u003cli&gt;Valeris agrees to guide them but plans to wait outside, hoping this act might qualify as selfless enough to break his curse.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:36,&quot;title&quot;:&quot;The Broken Mask Remembers&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;the-broken-mask-remembers\&quot;&gt;The Broken Mask Remembers\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party locates Count Vashen, known as “the broken mask,” slumped against a column at the edge of the festivities.\u003c/li&gt;\n\u003cli&gt;They notice his unremarkable appearance contrasts with the distinctive features of other fey—as if designed to be overlooked.\u003c/li&gt;\n\u003cli&gt;Lady Eventide recognizes him as the former Warden of Cloud Palace, someone she thought had died.\u003c/li&gt;\n\u003cli&gt;Delwath reveals to Vashen that Cloud Spinner is alive, though trapped.\u003c/li&gt;\n\u003cli&gt;Vashen initially doubts them and is reluctant to help, believing Cloud Spinner wouldn’t want his service.\u003c/li&gt;\n\u003cli&gt;Kenzo uses soul sight to temporarily suppress the memory-clouding effects of Fey wine on Vashen.\u003c/li&gt;\n\u003cli&gt;With memories restored, Vashen reveals he betrayed Cloud Spinner by bringing Shamat to the Cloud Palace.\u003c/li&gt;\n\u003cli&gt;Wellby shows Vashen the imprisoned Cloud Spinner in his necklace, confirming their story.\u003c/li&gt;\n\u003cli&gt;Vashen shares that Cloud Spinner’s keeps along the Sunset Gate each contained a drop of the Prism Well.\u003c/li&gt;\n\u003cli&gt;He advises they search these keeps for a connection to the Prism Well, though they would need sunlight to see it.\u003c/li&gt;\n\u003cli&gt;As Kenzo’s cleansing touch fades, Vashen’s memories slip away again.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:38,&quot;title&quot;:&quot;Plotting Their Course&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;plotting-their-course\&quot;&gt;Plotting Their Course\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party debates their next steps: either heading directly to the Sunset Gate and the keeps, or seeking information at the Shrouded Archive.\u003c/li&gt;\n\u003cli&gt;The group decides to follow the Sunset Gate path rather than pay unknown prices at the Shrouded Archive.\u003c/li&gt;\n\u003cli&gt;They discuss bringing either Valeris (the truth-telling satyr) or Ismara of Gleamwater (the scholar with the book) as companions.\u003c/li&gt;\n\u003cli&gt;Delwath plans to fulfill his storytelling obligation to Arendel while asking Lord Sovin for mounts.\u003c/li&gt;\n\u003cli&gt;Kenzo uses soul sight to determine that Ismara is genuinely a scholar from Gleamwater, not a spy.\u003c/li&gt;\n\u003cli&gt;They decide to invite both potential companions and see who agrees to join them.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:40,&quot;title&quot;:&quot;Taking Flight&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;taking-flight\&quot;&gt;Taking Flight\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party confirms that Fey wine gradually erodes memories with overindulgent consumption rather than causing immediate forgetfulness.\u003c/li&gt;\n\u003cli&gt;Ismara agrees to accompany them as far as the Sunset Gate, though she’s cautious about venturing north into more dangerous territory.\u003c/li&gt;\n\u003cli&gt;Lord Sovin agrees to provide mounts to carry them to the borders of his realm.\u003c/li&gt;\n\u003cli&gt;Wellby attempts to train the Wyvern trapped in their mirror, succeeding through a combination of animal handling, bardic inspiration, and animal telepathy.\u003c/li&gt;\n\u003cli&gt;Despite initial challenges, Wellby manages to calm the Wyvern enough to ride it, even allowing Kenzo to join him.\u003c/li&gt;\n\u003cli&gt;The Wyvern is described as partially tamed but still unpredictable, especially in combat situations.\u003c/li&gt;\n\u003cli&gt;Wellby and Kenzo take the Wyvern on flights above Emberwine while Delwath fulfills his storytelling obligation to Arendel.\u003c/li&gt;\n\u003cli&gt;The truth-telling satyr Valeris agrees to join their journey, hoping to escape his current situation.\u003c/li&gt;\n\u003cli&gt;The party banters about their track record of companions dying under their care, noting it’s “single-digit numbers.”\u003c/li&gt;\n\u003cli&gt;The session ends with the party departing Sunwine Hall - Wellby and Kenzo mounted on the Wyvern, the others riding colorful griffins provided by Lord Sovin.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:42,&quot;title&quot;:&quot;Wellby and Valeris - Extended Narrative&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;wellby-and-valeris---extended-narrative\&quot;&gt;Wellby and Valeris - Extended Narrative\u003c/h2&gt;\n\u003cp&gt;Wellby’s eyes scanned the revelry, noting how the fey danced and laughed with abandon. Every face seemed caught in perpetual delight—which is why the pouting satyr caught his attention so immediately. Sitting apart from the merriment, the satyr cut a striking figure with his curling ram’s horns wrapped in gold rings, his silk shirt half-buttoned, and a fiddle tucked under one arm.\u003cbr&gt;\nCurious, Wellby approached and introduced himself with a friendly smile. “You’re the first satyr I’ve met who isn’t dancing. Why no celebration for you?”\u003c/p&gt;\n\u003cp&gt;The satyr looked up, his expression souring further. “Damn! Why do you have to ask that?” He sighed deeply, adjusting his position. “Well, I’m cursed. Everything I say has to be brutally and completely honest.” His lips quirked into a sardonic smile. “You’d be surprised how often little white lies smooth over social graces. For example, I could say you look pretty out of place, but instead, all I can really say is, why did you come here, and why are you bothering me?”\u003c/p&gt;\n\u003cp&gt;Despite his harsh words, there was something oddly charming in his directness. Wellby, intrigued rather than offended, settled beside him.\u003c/p&gt;\n\u003cp&gt;“I’ve run into people with curses before and found ways to remove them,” Wellby offered. “How did you come to be cursed? It doesn’t look like any of these people would do that to you.”\u003c/p&gt;\n\u003cp&gt;The satyr rolled his eyes. “It’s a long story, and honestly, I’m pretty sick of telling it. But if you insist, I can’t really say no so well.” He glanced around before continuing. “I grew up here in Emberwine. It’s a beautiful place, you can tell.” He gestured broadly at the endless celebration. “Just looking around, you have to admit it’s beautiful.”\u003c/p&gt;\n\u003cp&gt;He explained how, at a revel much like this one, he encountered a woman named Yasara the Golden from Everlights Bloom. “She was beautiful, aloof, radiant,” he recounted. “She walked through the world as if it was a story she was only half aware of.”\u003c/p&gt;\n\u003cp&gt;When Yasara had sworn an oath of eternal love to her dance partner—an oath she clearly never intended to keep—the satyr had intervened. “I was arrogant,” he admitted. “I wanted to prove that I could twist fate myself. Who wouldn’t? A gambler who can change reality with stories… Come on! Isn’t that the best thing you could tell of yourself?”\u003c/p&gt;\n\u003cp&gt;His eyes gleamed with remembered pride. “And I, to be brutally honest, I did it. I told a tale so compelling and strong that reality shifted around it, and her oath was undone.” He paused, his momentary triumph fading. “And I could never lie again. Damn it, why did I waste my time with that stupid lady?”\u003c/p&gt;\n\u003cp&gt;“What are you looking forward to?” Wellby asked, changing the subject.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:true}]}]&lt;/script&gt;

 const style={textSize:i&gt;=3?18:17};

 sectionSelect.value=String(sectionIndex);
 document.getElementById(&#x27;tv-review-status&#x27;).textContent=page.kind+&#x27; · &#x27;+page.words.toLocaleString()+&#x27; words in rendered page · &#x27;+page.headingCount+&#x27; headings&#x27;;

  let group=toc;
  page.sections.forEach((s,j)=&gt;{
   if(s.level===2){group=toc;const children=page.sections.slice(j+1).findIndex(next=&gt;next.level&lt;=2);const end=children&lt;0?page.sections.length:j+1+children;const hasChildren=end&gt;j+1;

 });

(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }

    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);

      selectTab(selected);

  document.addEventListener(&quot;keydown&quot;, interact);

    document.removeEventListener(&quot;click&quot;, interact);

  }, { once: true });
})();

&lt;script id=&quot;taelgar-design-picker&quot;&gt;
(() =&gt; {
  const review = document.getElementById(&#x27;taelgar-review&#x27;);
  const root = review.querySelector(&#x27;.viz-carousel&#x27;);
  const panels = [...root.querySelectorAll(&#x27;:scope &gt; [data-variant]&#x27;)];
  root.classList.remove(&#x27;viz-carousel&#x27;);
  root.setAttribute(&#x27;role&#x27;, &#x27;group&#x27;);

  const controls = document.createElement(&#x27;fieldset&#x27;);
  controls.style.cssText = &#x27;border:0;padding:0;margin:0 0 20px;min-width:0&#x27;;
  const legend = document.createElement(&#x27;legend&#x27;);
  legend.textContent = `Design — ${panels.length} options`;
  legend.style.cssText = &#x27;margin-bottom:8px&#x27;;
  const buttons = document.createElement(&#x27;div&#x27;);
  buttons.className = &#x27;viz-row&#x27;;
  controls.append(legend, buttons);
  review.prepend(controls);

  const status = document.createElement(&#x27;span&#x27;);
  status.className = &#x27;sr-only&#x27;;
  status.setAttribute(&#x27;role&#x27;, &#x27;status&#x27;);
  controls.append(status);
  const choices = panels.map((panel, index) =&gt; {
    panel.id = `review-design-${index}`;
    panel.setAttribute(&#x27;role&#x27;, &#x27;group&#x27;);
    const button = document.createElement(&#x27;button&#x27;);
    button.type = &#x27;button&#x27;;
    button.className = &#x27;btn&#x27;;
    button.textContent = panel.dataset.variant;
    button.setAttribute(&#x27;aria-controls&#x27;, panel.id);
    button.addEventListener(&#x27;click&#x27;, () =&gt; select(index));
    buttons.append(button);
    return button;
  });
  function select(index) {
    panels.forEach((panel, i) =&gt; {
      panel.hidden = i !== index;
      choices[i].setAttribute(&#x27;aria-pressed&#x27;, String(i === index));
    });
    root.dataset.activeVariant = panels[index].dataset.variant;
    status.textContent = `${panels[index].dataset.variant}, design ${index + 1} of ${panels.length}`;
  }
  select(0);
})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }

    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");

      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {

      },
    );

      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );

  let state = null;

    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);

        frame.style.height = Math.ceil(height) + "px";

            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,

        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true

    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],

    { once: true },

  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

    // storing its content. This is a layout cache, not a security identity.

      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");

        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&

    }

  delete frame.dataset.srcdoc;
