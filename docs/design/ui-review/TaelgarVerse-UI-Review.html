k+lD/BinqAoBaZzXivD9WxZJaPzPMKIzlIRog2LLm1qqr7RoKNyhWeaeOSEPd6J8t2pWCgFpvXC0HGmJPa3bvxR7dX4ai7/kJx8BUdPNqErnQWbQE0MpS0VDzw7fQdJ8j0W0ikHQJdEf2ExxKBnqkjlFYa1cqDWYzlQ0wkp0X0zIkV4RKjEbfDHDepJJaXrhDP3p14ExlaMmYDPEqeyhJPTcOQtPmpd+xqCYGyIiB4jVJ4fbAJWKfhR9drjnneGXvIAa8/D1khM0x//SslE09fwjF0iXDTczSyWaDLfBP4MkZQC4NbAmrKzZO6XvkE4xPEpuPfn9BCfQNjN+EE21C5XbFQABLJEe/NKoU/4EqUU80lsSQC6zvfii2Vhpy6KqHddG3QFO7TnXe+u+Cz6SWYgb5DX0h867C4QrpgA30xVH+mav7Vn19XnAAjdo0PVc4gr+oyaaonzQAcCw/FMbxwelHnxD/mQ3Om7vf6+Q0kYo77o/ZZRfNKpQct8kx/pKpzfeLd6ssopCO94IG21XLsgJNwDqDwgdeOUsQa0XUz2sdCctjYREp1U9z0xCfSYFNTTWpbLVp4EUMEuOCuEhaLwGReMohB7eeKRt4AAAACX6GW0JNING/a23GNBB8vU1ujkLbtwvQt6pjSvJno/qZuTjtxe9Z71kJXlsmp84ZknDNBHU2qllITN5yaRqn3B8n03VD7nfoMdx8nY3ml8r1Y70msY83sjLgEwBqFMJwpYcx8miQFmd5kcfZD3gAAAAA=\&quot; alt=\&quot;Voltara Outline\&quot; data-map=\&quot;true\&quot;&gt;\u003c/p&gt;\n\u003cp&gt;\u003cem&gt;Library (1):\u003c/em&gt; At the northern edge of town is the academic precinct, which houses dormitories, a library, and various buildings associated with the archivists of the Great Library who come to study the inner workings of chalyte magic. The library complex is itself surrounded by walls, and overseen by Master Archivist Gaius. The wizard’s gate leads north from this precinct.\u003c/p&gt;\n\u003cp&gt;\u003cem&gt;Chalyte (2):\u003c/em&gt; Southwest of the library precinct are a series of buildings and workshops involved in the sometimes-hazardous processing of chalyte ore, both for local use and for preparation to transport to Chardon. This area sometimes suffers from strange magical effects.\u003c/p&gt;\n\u003cp&gt;\u003cem&gt;Baths  / Central  (3):\u003c/em&gt; In the center of town is a large baths complex, and the main public market. The eastern part of this precinct, spilling into the temple precinct, is the wealthy part of town and dominated by manor houses and villas.\u003c/p&gt;\n\u003cp&gt;\u003cem&gt;Temple (4):\u003c/em&gt; East of the baths is a large temple dedicated to the Eight Divines. This is also a wealthy area with manor houses. The temple gate leads east from this precinct.\u003c/p&gt;\n\u003cp&gt;\u003cem&gt;Artificer’s Way (5):\u003c/em&gt; South of the chalyte precinct, the street known as artificer’s way runs south, giving this precinct its name, and terminating at the Waygate, one of the two primary gates to Voltara. While much of the chalyte mined here goes south to fuel industry in Chardon, Voltara has a small but extremely skilled community of artificers, largely centered in this precinct. The relatively minor Smallgate also exits west from this precinct.\u003c/p&gt;\n\u003cp&gt;\u003cem&gt;Fort Hill (6)\u003c/em&gt;: The southernmost precinct sits on a small rise, on the site of the original border fort that once stood here. The proconsul, who administers the city in the name of the Magistros, is based here, as are the old fortifications and parade grounds pre-dating the city proper. The city gate exits south from this precinct.\u003c/p&gt;\n\u003cp&gt;\u003cem&gt;Outer (7):\u003c/em&gt; A large fraction of the population of Voltara lives in slums and settlements that have grown up along the south wall and extend along the main road leading south from Voltara to Lake Valandros and eventually Chardon. This area has no formal name, but many informal ones, and has a much more rough-and-tumble frontier feeling than the city proper.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:15,&quot;title&quot;:&quot;Inns&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;inns\&quot;&gt;Inns\u003c/h2&gt;\n\u003cp&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;The Purple Pig\u003c/span&gt;\u003c/p&gt;\n\u003cp&gt;A modest accommodation outside the city walls, run by Dravia. Modest accommodations, 1 gp per day. Destroyed by \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Grumella\u003c/span&gt;.\u003c/p&gt;\n\u003cp&gt;The Sage and Spear\u003c/p&gt;\n\u003cp&gt;A comfortable inn just outside the town gates, in what passes for a small Dwarven district here. The innkeeper is a retired dwarven soldier named Orin Stonekeeper. It is a two-story stone building with two wings, and a large common room that tends to attract artisans and dwarves. Known for sausages.\u003c/p&gt;\n\u003cp&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;The Wandering Toad\u003c/span&gt;\u003c/p&gt;\n\u003cp&gt;A small inn just inside the city gates, modest in size but welcoming and friendly. Considered comfortable accommodations, 2 gp for food, drink, lodging. Known for wild game, mushrooms, and ale. Run by a charming, friendly, and unusually large halfling man known as \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Finoc Small\u003c/span&gt;.\u003c/p&gt;\n\u003cp&gt;The Ruby Flask\u003c/p&gt;\n\u003cp&gt;The premier lodging in Voltara. Can stay in private rooms with more modest food for 4 gp a day, or in a whole wing with servants and suites for 15 gp per day. Both prices include food, drink, rooms; the more expensive option includes servants as well. A three-story marble villa near the baths. Known for its wines and smoked meats. Run by a thin, prim and proper older human man, Decius Prixima.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false}]},{&quot;title&quot;:&quot;Melusa&quot;,&quot;label&quot;:&quot;Melusa — Village · short&quot;,&quot;kind&quot;:&quot;Place&quot;,&quot;words&quot;:299,&quot;headingCount&quot;:3,&quot;context&quot;:&quot;Modern · 29 June 1752 DR&quot;,&quot;sections&quot;:[{&quot;start&quot;:1,&quot;title&quot;:&quot;Opening&quot;,&quot;level&quot;:1,&quot;html&quot;:&quot;\u003cp&gt; \u003cem&gt;(meh-LOO-sah)\u003c/em&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;tv-metadata\&quot;&gt;\n\u003cul&gt;\n\u003cli&gt; A \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Zimka\u003c/span&gt; village in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Zeyfa’s Realm\u003c/span&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/div&gt;\n\u003cp&gt;Melusa is an isolated \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Zimka\u003c/span&gt; village of 400-500 people in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Zeyfa’s Realm\u003c/span&gt;, a mist-bound place whose cliffs and floating islands resemble the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great Chasm\u003c/span&gt;. Its inhabitants speak Old Zimkovan and live under the fey lord \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Forquarion\u003c/span&gt;, whom they call Malquin the Vaqar.\u003c/p&gt;\n\u003cp&gt;Most of the village consists of stone houses that cluster on a broad cliffside ledge around a waterfall-fed pool teeming with salmon. Rope bridges connect the village to two floating islands: one supports grazing cattle, the other lush fruit trees and crops. A third island holds Forquarion’s palace of ice.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:5,&quot;title&quot;:&quot;Life and Beliefs&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;life-and-beliefs\&quot;&gt;Life and Beliefs\u003c/h2&gt;\n\u003cp&gt;Most of the time, a pale sun hangs almost motionless behind gray clouds. Rarely, it fades, and day turns to night. When this happens, the villagers believe a sacrifice must be sent into \u003cspan class=\&quot;tv-crosslink\&quot;&gt;the labyrinth\u003c/span&gt; before daylight can return. Without a normal cycle of day and night, a gong from the palace marks the hours for sleeping and waking.\u003c/p&gt;\n\u003cp&gt;The villagers say their ancestors were brought here by \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Zeyfa\u003c/span&gt; to escape a great tragedy, and regard Malquin as Zeyfa’s lieutenant. Rumors of other \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kestavo\u003c/span&gt; survive only as distant, half-remembered stories in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Melusa\u003c/span&gt;. The elders preach endurance, treating their isolation as punishment for ancestral sins, while \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Zahara\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Iskander\u003c/span&gt;, and a small circle of dissidents seek a way out.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:8,&quot;title&quot;:&quot;The Chasm Explorers&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;the-chasm-explorers\&quot;&gt;The Chasm Explorers\u003c/h2&gt;\n\u003cp&gt;In \u003cspan class=\&quot;tv-crosslink\&quot;&gt;January 1730\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kalima\u003c/span&gt; led the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasm Explorers\u003c/span&gt; to Melusa after their escape from the labyrinth. Strange cracks had opened in the cliff, but palace guards and a giant ice wolf barred the only apparently safe route back to the Great Chasm.\u003c/p&gt;\n\u003cp&gt;After bargaining with Forquarion for passage, the explorers later \u003cspan class=\&quot;tv-crosslink\&quot;&gt;returned to evacuate roughly thirty-five willing villagers\u003c/span&gt; before the portal pulled away from the cliff. Most villagers stayed behind; their subsequent fate remains unknown.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false}]},{&quot;title&quot;:&quot;The Green Sea&quot;,&quot;label&quot;:&quot;Green Sea — Sea · no sections&quot;,&quot;kind&quot;:&quot;Place&quot;,&quot;words&quot;:221,&quot;headingCount&quot;:1,&quot;context&quot;:&quot;Modern · 29 June 1752 DR&quot;,&quot;sections&quot;:[{&quot;start&quot;:1,&quot;title&quot;:&quot;Opening&quot;,&quot;level&quot;:1,&quot;html&quot;:&quot;\u003cdiv class=\&quot;tv-metadata\&quot;&gt;\n\u003cul&gt;\n\u003cli&gt; A sea in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Taelgar\u003c/span&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/div&gt;\n\u003cp&gt;The Green Sea is a large inland sea, bordered by the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Western Gulf\u003c/span&gt; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cymean Peninsula\u003c/span&gt; in the west; the islands of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Skaerhem\u003c/span&gt; and the secluded cold lands of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ursk\u003c/span&gt; in the north; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;mysterious deserts\u003c/span&gt; of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;myth\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;rumor\u003c/span&gt; to the south. To the east, the Green Sea connects to the open oceans beyond, though separated by an extensive and magical island chain known as the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Eastern Isles\u003c/span&gt;. The large island known as \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Irrla\u003c/span&gt; forms the boundary between the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Eastern Green Sea\u003c/span&gt; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Western Green Sea\u003c/span&gt;.\u003c/p&gt;\n\u003cp&gt;Climatically, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Western Green Sea\u003c/span&gt; is dominated by the spring and summer monsoons that bring rain from the ocean to \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembara\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cymea\u003c/span&gt;,  \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt;, and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Vostok\u003c/span&gt;. The monsoon winds drive upwelling, and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Western Green Sea\u003c/span&gt; is rich in phytoplankton and the marine life that feeds on it, giving the Green Sea the characteristic greenish tint from which its name derives. The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Eastern Green Sea\u003c/span&gt;, much less affected by the monsoons, and with wider expanses of open water, tends towards maritime climates along the immediate coast, often with drier summers and wet winters.\u003c/p&gt;\n\u003cp&gt;The prevailing winds tend to favor sailing east in the winter, and west in the summer, especially along the north and west parts of the ocean, where monsoon winds are most dominant.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false}]},{&quot;title&quot;:&quot;Dunmari Frontier - Session 110&quot;,&quot;label&quot;:&quot;Session 110 (DuFr) — Session · long narrative&quot;,&quot;kind&quot;:&quot;Session note&quot;,&quot;words&quot;:6203,&quot;headingCount&quot;:26,&quot;context&quot;:&quot;Dunmar Frontier · 12 August 1749 DR&quot;,&quot;sections&quot;:[{&quot;start&quot;:1,&quot;title&quot;:&quot;Opening&quot;,&quot;level&quot;:1,&quot;html&quot;:&quot;\u003cdiv class=\&quot;admonition info\&quot;&gt;\u003cp class=\&quot;admonition-title\&quot;&gt;Ra’ghemdros’ Fall: in which the party frees a prisoner and defeats a dragon\u003c/p&gt;\n\u003cp&gt;\u003cem&gt;Featuring: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Seeker\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Delwath\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Wellby\u003c/span&gt;\u003c/em&gt;\u003cbr&gt;\n\u003cem&gt;In Taelgar: May 19, 1749 DR to May 21, 1749 DR\u003c/em&gt;\u003cbr&gt;\n\u003cem&gt;On Earth: Saturday Sep 28, 2024\u003c/em&gt;\u003cbr&gt;\n\u003cem&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Circular Island\u003c/span&gt;\u003c/em&gt;\u003c/p&gt;\n\u003c/div&gt;\n\u003cp&gt;The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dunmar Fellowship\u003c/span&gt; acquires the last fragment of jade, frees the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cloudspinner\u003c/span&gt; from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cha’mutte\u003c/span&gt;’s prison, and defeats the dragon \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;, securing a significant victory and treasure for their quest.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:3,&quot;title&quot;:&quot;Session Info&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;session-info\&quot;&gt;Session Info\u003c/h2&gt;\n\u003ch3 id=\&quot;summary\&quot;&gt;Summary\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party debates freeing a hobgoblin but decides against it due to potential risks.\u003c/li&gt;\n\u003cli&gt;They strategize to confront the dragon \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;, seeking aid from Ghesh.\u003c/li&gt;\n\u003cli&gt;The party negotiates with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; for jade, managing to strike a deal.\u003c/li&gt;\n\u003cli&gt;They battle a fiend in the villa, ultimately discovering and freeing Cloud Spinner.\u003c/li&gt;\n\u003cli&gt;The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dunmar\u003c/span&gt; Fellowship engages in a fierce battle against \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; and emerges victorious.\u003c/li&gt;\n\u003cli&gt;They explore \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;’ lair, claiming valuable treasures and leaving Dimitar in charge.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3 id=\&quot;timeline\&quot;&gt;Timeline\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;May 20, 1749 DR, morning: Talk to \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Revaka\u003c/span&gt; in the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mirror of Soul Trapping\u003c/span&gt;; discuss how to approach \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;; depart to speak with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ghesh\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Megren\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;May 20, 1749 DR, afternoon: Audience with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;. Negotiate for jade. Scout ruined village; find probable location of fiend. Trade for jade and give \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; Apollyon’s Throne. Enter villa; fight fiend; recover \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cloudspinner\u003c/span&gt;’s trapped body.\u003c/li&gt;\n\u003cli&gt;May 20, 1749 DR, evening: Flee to Dimitaur’s lair in the temple complex; discuss situation and prepare to fight \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;May 21, 1749 DR, predawn: Find \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dragonets\u003c/span&gt; scouting, send them off with word that Ra’ghemdros will die. Repair light tower in center of temple complex. Fight minions. Fight Ra’ghemdros. Win.\u003c/li&gt;\n\u003cli&gt;May 21, 1749 DR, morning: Recover \u003cspan class=\&quot;tv-crosslink\&quot;&gt;treasure\u003c/span&gt; from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;’ lair, turn over some treasure to \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dimitaur\u003c/span&gt; and leave him in charge. Sail through storm with Milo and Tilly.\u003c/li&gt;\n\u003cli&gt;May 21, 1749 DR, afternoon: Arrive back on \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Vindristjarna\u003c/span&gt;.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3 id=\&quot;visions\&quot;&gt;Visions\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;The Last Jade Vision\u003c/span&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3 id=\&quot;treasure\&quot;&gt;Treasure\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The 10 record books of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Concordia Pyrae\u003c/span&gt;. Seven record extensive research into the magic of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Plane of Fire\u003c/span&gt;. Three are a chronicle of events, detailing the history of the villa. These records indicate that the villa was once a major pilgrimage site in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankor\u003c/span&gt;, and later a place where many wizards conducted research. The chronicles also describe the downfall of the island, including a war between \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Apollyon\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cha’mutte\u003c/span&gt; over possession of a prisoner, with the last entries warning of the island’s imminent destruction\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros’ Hoard\u003c/span&gt;\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:4,&quot;title&quot;:&quot;Summary&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;summary\&quot;&gt;Summary\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party debates freeing a hobgoblin but decides against it due to potential risks.\u003c/li&gt;\n\u003cli&gt;They strategize to confront the dragon \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;, seeking aid from Ghesh.\u003c/li&gt;\n\u003cli&gt;The party negotiates with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; for jade, managing to strike a deal.\u003c/li&gt;\n\u003cli&gt;They battle a fiend in the villa, ultimately discovering and freeing Cloud Spinner.\u003c/li&gt;\n\u003cli&gt;The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dunmar\u003c/span&gt; Fellowship engages in a fierce battle against \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; and emerges victorious.\u003c/li&gt;\n\u003cli&gt;They explore \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;’ lair, claiming valuable treasures and leaving Dimitar in charge.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:6,&quot;title&quot;:&quot;Timeline&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;timeline\&quot;&gt;Timeline\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;May 20, 1749 DR, morning: Talk to \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Revaka\u003c/span&gt; in the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mirror of Soul Trapping\u003c/span&gt;; discuss how to approach \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;; depart to speak with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ghesh\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Megren\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;May 20, 1749 DR, afternoon: Audience with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;. Negotiate for jade. Scout ruined village; find probable location of fiend. Trade for jade and give \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; Apollyon’s Throne. Enter villa; fight fiend; recover \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cloudspinner\u003c/span&gt;’s trapped body.\u003c/li&gt;\n\u003cli&gt;May 20, 1749 DR, evening: Flee to Dimitaur’s lair in the temple complex; discuss situation and prepare to fight \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;May 21, 1749 DR, predawn: Find \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dragonets\u003c/span&gt; scouting, send them off with word that Ra’ghemdros will die. Repair light tower in center of temple complex. Fight minions. Fight Ra’ghemdros. Win.\u003c/li&gt;\n\u003cli&gt;May 21, 1749 DR, morning: Recover \u003cspan class=\&quot;tv-crosslink\&quot;&gt;treasure\u003c/span&gt; from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;’ lair, turn over some treasure to \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dimitaur\u003c/span&gt; and leave him in charge. Sail through storm with Milo and Tilly.\u003c/li&gt;\n\u003cli&gt;May 21, 1749 DR, afternoon: Arrive back on \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Vindristjarna\u003c/span&gt;.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:8,&quot;title&quot;:&quot;Visions&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;visions\&quot;&gt;Visions\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;The Last Jade Vision\u003c/span&gt;\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:10,&quot;title&quot;:&quot;Treasure&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;treasure\&quot;&gt;Treasure\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The 10 record books of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Concordia Pyrae\u003c/span&gt;. Seven record extensive research into the magic of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Plane of Fire\u003c/span&gt;. Three are a chronicle of events, detailing the history of the villa. These records indicate that the villa was once a major pilgrimage site in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankor\u003c/span&gt;, and later a place where many wizards conducted research. The chronicles also describe the downfall of the island, including a war between \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Apollyon\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cha’mutte\u003c/span&gt; over possession of a prisoner, with the last entries warning of the island’s imminent destruction\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros’ Hoard\u003c/span&gt;\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:12,&quot;title&quot;:&quot;Narrative&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;narrative\&quot;&gt;Narrative\u003c/h2&gt;\n\u003ch3 id=\&quot;part-1-the-jade-and-the-cloudspinner\&quot;&gt;Part 1: The Jade and the Cloudspinner\u003c/h3&gt;\n\u003cp&gt;We begin in the morning, as the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dunmar Fellowship\u003c/span&gt; awakes from their rest after their return from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Apollyon’s Tower\u003c/span&gt;, and considers their next move against \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;. The morning begins with a brief, unproductive discussion with the hobgoblin wizard \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Revaka\u003c/span&gt;, trapped in the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mirror of Soul Trapping\u003c/span&gt; by \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cha’mutte\u003c/span&gt; and who the party hoped might be a useful ally against his daughter, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;. With the hobgoblin a dead end, the party discussed other possible approaches to deal with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;: how could they lure her from her lair, and could they even defeat her in her domain, if they could not lure her forth? Eventually, a plan was formed: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt; would offer to trade treasure from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Apollyon’s Tower\u003c/span&gt; for the jade, and use \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ghesh\u003c/span&gt; as an intermediary to arrange a meeting, pretending his teleportation magic would not survive an extraplanar journey to lure her out of her lair.\u003c/p&gt;\n\u003cp&gt;Taking to the skies in the forms of swift birds, the party traveled westward, their destination set: a meeting with Ghesh. Upon their arrival, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt; spoke with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ghesh\u003c/span&gt;, hinting at a treasure, something \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; would desire. Ghesh, intrigued, agreed to help, and soon three \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dragonets\u003c/span&gt; were escorting the party to the heart of the black dragon’s territory. They flew with purpose, Kenzo jogging below while the rest traveled in disguise.\u003c/p&gt;\n\u003cp&gt;The party reached the ruins of the villa where Ra’ghemdros made her lair by early afternoon. Above them, Ra’ghemdros perched, her presence imposing. Her black scales were interrupted only by the scar that shimmered in deep red hues. After a brief and obsequious conversation with Kenzo, she agreed to the trade, and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt; offered to return in two hours with Apollyon’s Throne.\u003c/p&gt;\n\u003cdetails class=\&quot;quote\&quot; open=\&quot;\&quot;&gt;\u003csummary&gt;Ra’ghemdros’ Negotiation\u003c/summary&gt;\n\u003cp&gt;Ra’ghemdros begins by introducing herself: “I am Ra’ghemdros, daughter of Cha’mutte, I am the Light Stealer and the Final Shadow, the Devourer of Drankor, the Last Empress of Hkar, known as the Eternal Night and Enslaver of the Secret Sunset.”\u003c/p&gt;\n\u003cp&gt;Kenzo bows deeply and addresses her respectfully: “The Final Shadow. It is an honor to be in your presence and to have this audience.”\u003c/p&gt;\n\u003cp&gt;Ra’ghemdros acknowledges them and listens to Kenzo’s claim of having traveled to the western tower, her interest piqued. “Do you know of this place, the tower to the west?” Kenzo asks, to which she replies, “Of course. I know of everything in my domain.”\u003c/p&gt;\n\u003cp&gt;Ra’ghemdros expresses interest in what lies within the tower: “I would dearly love his throne, and I would be willing to trade. What is this you wish? The smallest trinket, a piece of jade?” Kenzo queries, “If I bring you his throne, you’d be willing to make that trade?” “Yes, I would”, Ra’ghemdros replies.&amp;nbsp;\u003c/p&gt;\n\u003cp&gt;When asked if they could obtain safe passage, Ra’ghemdros agrees but warns, “As soon as you take the jade, you must leave immediately. You will be no longer welcome. I would not have you lingering in my domain–I would not wish to draw Apollyon’s Eye.”\u003c/p&gt;\n\u003cp&gt;Ra’ghemdros also warns of Apollyon’s looming threat, stating, “All prisons fail…” while glancing at the nearby villa, which seems to be always at the forefront of her attention.&amp;nbsp;\u003c/p&gt;\n\u003c/details&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:13,&quot;title&quot;:&quot;Part 1: The Jade and the Cloudspinner&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;part-1-the-jade-and-the-cloudspinner\&quot;&gt;Part 1: The Jade and the Cloudspinner\u003c/h3&gt;\n\u003cp&gt;We begin in the morning, as the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dunmar Fellowship\u003c/span&gt; awakes from their rest after their return from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Apollyon’s Tower\u003c/span&gt;, and considers their next move against \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;. The morning begins with a brief, unproductive discussion with the hobgoblin wizard \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Revaka\u003c/span&gt;, trapped in the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mirror of Soul Trapping\u003c/span&gt; by \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cha’mutte\u003c/span&gt; and who the party hoped might be a useful ally against his daughter, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;. With the hobgoblin a dead end, the party discussed other possible approaches to deal with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt;: how could they lure her from her lair, and could they even defeat her in her domain, if they could not lure her forth? Eventually, a plan was formed: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt; would offer to trade treasure from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Apollyon’s Tower\u003c/span&gt; for the jade, and use \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ghesh\u003c/span&gt; as an intermediary to arrange a meeting, pretending his teleportation magic would not survive an extraplanar journey to lure her out of her lair.\u003c/p&gt;\n\u003cp&gt;Taking to the skies in the forms of swift birds, the party traveled westward, their destination set: a meeting with Ghesh. Upon their arrival, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt; spoke with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ghesh\u003c/span&gt;, hinting at a treasure, something \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; would desire. Ghesh, intrigued, agreed to help, and soon three \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dragonets\u003c/span&gt; were escorting the party to the heart of the black dragon’s territory. They flew with purpose, Kenzo jogging below while the rest traveled in disguise.\u003c/p&gt;\n\u003cp&gt;The party reached the ruins of the villa where Ra’ghemdros made her lair by early afternoon. Above them, Ra’ghemdros perched, her presence imposing. Her black scales were interrupted only by the scar that shimmered in deep red hues. After a brief and obsequious conversation with Kenzo, she agreed to the trade, and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt; offered to return in two hours with Apollyon’s Throne.\u003c/p&gt;\n\u003cdetails class=\&quot;quote\&quot; open=\&quot;\&quot;&gt;\u003csummary&gt;Ra’ghemdros’ Negotiation\u003c/summary&gt;\n\u003cp&gt;Ra’ghemdros begins by introducing herself: “I am Ra’ghemdros, daughter of Cha’mutte, I am the Light Stealer and the Final Shadow, the Devourer of Drankor, the Last Empress of Hkar, known as the Eternal Night and Enslaver of the Secret Sunset.”\u003c/p&gt;\n\u003cp&gt;Kenzo bows deeply and addresses her respectfully: “The Final Shadow. It is an honor to be in your presence and to have this audience.”\u003c/p&gt;\n\u003cp&gt;Ra’ghemdros acknowledges them and listens to Kenzo’s claim of having traveled to the western tower, her interest piqued. “Do you know of this place, the tower to the west?” Kenzo asks, to which she replies, “Of course. I know of everything in my domain.”\u003c/p&gt;\n\u003cp&gt;Ra’ghemdros expresses interest in what lies within the tower: “I would dearly love his throne, and I would be willing to trade. What is this you wish? The smallest trinket, a piece of jade?” Kenzo queries, “If I bring you his throne, you’d be willing to make that trade?” “Yes, I would”, Ra’ghemdros replies.&amp;nbsp;\u003c/p&gt;\n\u003cp&gt;When asked if they could obtain safe passage, Ra’ghemdros agrees but warns, “As soon as you take the jade, you must leave immediately. You will be no longer welcome. I would not have you lingering in my domain–I would not wish to draw Apollyon’s Eye.”\u003c/p&gt;\n\u003cp&gt;Ra’ghemdros also warns of Apollyon’s looming threat, stating, “All prisons fail…” while glancing at the nearby villa, which seems to be always at the forefront of her attention.&amp;nbsp;\u003c/p&gt;\n\u003c/details&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:25,&quot;title&quot;:&quot;Part 2: The Battle Against Ra’ghemdros&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;part-2-the-battle-against-raghemdros\&quot;&gt;Part 2: The Battle Against Ra’ghemdros\u003c/h3&gt;\n\u003cp&gt;The party gathered at Dimitar’s tower, weary but resolute, knowing the upcoming confrontation with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; would test their strength and unity like never before. As they rested, they shared a \u003cspan class=\&quot;tv-crosslink\&quot;&gt;vision\u003c/span&gt;—a vision of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Rai\u003c/span&gt;, the ancient battle with Apollyon, and the eerie bindings that still held sway over the realm.\u003c/p&gt;\n\u003cp&gt;With the alarm spell triggered, the party scrambled to confront a pair of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dragonets\u003c/span&gt;, learning that they were sent to keep search for the party and report back. Letting them go, the party worked to prepare for the inevitable fight. Seeker repaired the damaged lighthouse crystal, preparing to use it as a beacon in the battle to come. \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tilly Brineheart\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Milo Thistlefoot\u003c/span&gt; – having been warned by the party to flee the dragon – instead arrived to help in the battle, reporting that Ra’ghemdros and her forces were approaching—chimeras and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dragonets\u003c/span&gt; advancing rapidly.\u003c/p&gt;\n\u003cp&gt;The battle with the dragon’s minions was fierce, a relentless storm of claws and elemental power. Seeker’s Rune of Psychic Disruption and Tilly’s Ice Storm weakened their enemies, while \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt;, enlarged by magic, waited to engage directly. Together, the party fought valiantly, gradually thinning their foes, but the real test awaited them.\u003c/p&gt;\n\u003cp&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ra’ghemdros\u003c/span&gt; descended with the force of a nightmare—its breath a deadly mix of darkness and acid that swept through the battlefield. \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Delwath\u003c/span&gt; and Kenzo faced the dragon directly, while \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Seeker\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Wellby\u003c/span&gt; kept their distance, delivering attacks from afar. The ancient beast used every advantage it had—legendary resistances, turning incorporeal, and terrifying presence that threatened to break their resolve.\u003c/p&gt;\n\u003cp&gt;But the party held their ground. Seeker’s constructs kept the dragon distracted, and Kenzo’s unrelenting attacks wore it down. Delwath cast spells to bolster defenses, and Tilly provided crucial healing, keeping them all in the fight. They fought strategically, spreading out to avoid being overwhelmed by Ra’ghemdros’ devastating breath attacks.\u003c/p&gt;\n\u003cp&gt;As Ra’ghemdros grew weaker, Dimitar seized the opportunity, launching a powerful fireball that shook the battlefield. With one final push, Kenzo leaped onto the dragon’s back, delivering a series of crushing blows. Ra’ghemdros let out a final, defiant roar before collapsing, its massive body crashing to the earth—a symbol of the party’s hard-won victory.\u003c/p&gt;\n\u003cp&gt;As the dragon fell, the horizon was painted in vivid colors, and suddenly, the sun began to rise, casting an entire 360-degree circle of radiant sunset around the battlefield. It was a moment of profound beauty amidst the chaos, signaling the end of a fierce confrontation and the dawn of a new hope for the party.\u003c/p&gt;\n\u003cp&gt;In the aftermath, the party stood victorious but battered. They knew this was not the end, but a significant milestone in their journey. The shadow of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Apollyon\u003c/span&gt; and the remnants of Rai’s vision still loomed, but for now, they had defeated an ancient terror and reclaimed a glimmer of hope in the face of darkness.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:40,&quot;title&quot;:&quot;Detailed Summary&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;detailed-summary\&quot;&gt;Detailed Summary\u003c/h2&gt;\n\u003ch3 id=\&quot;bargaining-with-the-hobgoblin-in-the-mirror\&quot;&gt;Bargaining with the Hobgoblin in the Mirror\u003c/h3&gt;\n\u003cp&gt;The party attempts to negotiate with a hobgoblin imprisoned in a magical mirror, seeking information that could help them in their upcoming confrontation.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The group discusses what they can offer to the hobgoblin in exchange for her help, considering freedom or other potential promises.\u003c/li&gt;\n\u003cli&gt;The characters debate the morality of the hobgoblin’s imprisonment, including arguments about restorative justice and whether hobgoblins have souls.\u003c/li&gt;\n\u003cli&gt;Kenzo, Delwath, and the others approach the hobgoblin cautiously, hoping to use shared enemies as a way to build an alliance.\u003c/li&gt;\n\u003cli&gt;The party tests the hobgoblin’s reaction by mentioning Cha’mutte’s daughter, Ra’ghemdros, attempting to gauge her willingness to cooperate.\u003c/li&gt;\n\u003cli&gt;The conversation shifts towards the possibility of releasing the hobgoblin, but the group is conflicted about the risks involved.\u003c/li&gt;\n\u003cli&gt;Delwath presents the idea of using the hobgoblin to destabilize other hobgoblin forces, potentially creating a civil conflict.\u003c/li&gt;\n\u003cli&gt;Ultimately, the group decides against releasing her, fearing she could become a greater threat.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3 id=\&quot;planning-the-dragon-ambush\&quot;&gt;Planning the Dragon Ambush\u003c/h3&gt;\n\u003cp&gt;The party strategizes on how to deal with a powerful dragon, debating whether to lure her out of her lair or face her directly inside.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The group considers using rumors or indirect messages to draw the dragon out of her lair, hoping to avoid a confrontation in her heavily fortified territory.\u003c/li&gt;\n\u003cli&gt;They weigh the risks of fighting the dragon outside versus inside her lair, and whether they should negotiate for the jade or prepare for a direct fight.\u003c/li&gt;\n\u003cli&gt;Ultimately, the party decides to prepare for both negotiation and combat, using stealth and misdirection to their advantage.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3 id=\&quot;journey-to-the-dragons-lair\&quot;&gt;Journey to the Dragon’s Lair\u003c/h3&gt;\n\u003cp&gt;The party sets their plan into motion, transforming into animals and traveling to meet Ghesh in hopes of securing an audience with the dragon Ra’ghemdros.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The group transforms into fast-flying birds to approach Ghesh, using the disguise to maintain secrecy and build rapport with him.\u003c/li&gt;\n\u003cli&gt;Kenzo convinces Ghesh to help arrange a meeting with Ra’ghemdros, hinting that he has discovered something important in the western region that the dragon would want to know about, potentially involving treasure that could be rescued for Ra’ghemdros.&amp;nbsp;\u003c/li&gt;\n\u003cli&gt;Ghesh agrees to send a message to Ra’ghemdros, and three dragonettes are assigned to escort the party to the dragon’s lair. Kenzo jogs alongside the dragonettes, while the rest of the party travels in animal form.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3 id=\&quot;audience-with-raghemdros\&quot;&gt;Audience with Ra’ghemdros\u003c/h3&gt;\n\u003cp&gt;The party meets Ra’ghemdros, the powerful black dragon, in her lair amidst the ruins of an ancient villa of a lost Drankorian scholarly or magical society.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The party arrives at the thermal bath complex, where Ra’ghemdros is perched above, her massive pitch-black form marred by a scar shimmering in reds and oranges.\u003c/li&gt;\n\u003cli&gt;Ra’ghemdros begins by introducing herself: “I am Ra’ghemdros, daughter of Cha’mutte, I am the Light Stealer and the Final Shadow, the Devourer of Drankor, the Last Empress of Hkar, known as the Eternal Night and Enslaver of the Secret Sunset.”\u003c/li&gt;\n\u003cli&gt;Kenzo bows deeply and addresses her respectfully: “The Final Shadow. It is an honor to be in your presence and to have this audience.”\u003c/li&gt;\n\u003cli&gt;Ra’ghemdros acknowledges them and listens to Kenzo’s claim of having traveled to the western tower, her interest piqued. “Do you know of this place, the tower to the west?” Kenzo asks, to which she replies, “Of course. I know of everything in my domain.”\u003c/li&gt;\n\u003cli&gt;Ra’ghemdros expresses interest in what lies within the tower: “I would dearly love his throne, and I would be willing to trade. What is this you wish? The smallest trinket, a piece of jade?” Kenzo queries, “If I bring you his throne, you’d be willing to make that trade?” “Yes, I would”, Ra’ghemdros replies.&amp;nbsp;\u003c/li&gt;\n\u003cli&gt;When asked if they could obtain safe passage, Ra’ghemdros agrees but warns, “As soon as you take the jade, you must leave immediately. You will be no longer welcome. I would not have you lingering in my domain–I would not wish to draw Apollyon’s Eye.”\u003c/li&gt;\n\u003cli&gt;Ra’ghemdros also warns of Apollyon’s looming threat, stating, “All prisons fail…” while glancing at the nearby villa, which seems to be always at the forefront of her attention.&amp;nbsp;\u003c/li&gt;\n\u003cli&gt;The party discusses the logistics of retrieving the throne, weighing the use of magic or stealth to avoid detection and minimize conflict.\u003c/li&gt;\n\u003cli&gt;The group agrees that while Ra’ghemdros might seem cooperative, they must remain cautious and consider backup plans in case the negotiation fails or a trap is sprung.\u003c/li&gt;\n\u003cli&gt;She departs to her lair, after agreeing to meet the party back in 2 hours and granting them safe passage in the meantime.&amp;nbsp;\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:41,&quot;title&quot;:&quot;Bargaining with the Hobgoblin in the Mirror&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;bargaining-with-the-hobgoblin-in-the-mirror\&quot;&gt;Bargaining with the Hobgoblin in the Mirror\u003c/h3&gt;\n\u003cp&gt;The party attempts to negotiate with a hobgoblin imprisoned in a magical mirror, seeking information that could help them in their upcoming confrontation.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The group discusses what they can offer to the hobgoblin in exchange for her help, considering freedom or other potential promises.\u003c/li&gt;\n\u003cli&gt;The characters debate the morality of the hobgoblin’s imprisonment, including arguments about restorative justice and whether hobgoblins have souls.\u003c/li&gt;\n\u003cli&gt;Kenzo, Delwath, and the others approach the hobgoblin cautiously, hoping to use shared enemies as a way to build an alliance.\u003c/li&gt;\n\u003cli&gt;The party tests the hobgoblin’s reaction by mentioning Cha’mutte’s daughter, Ra’ghemdros, attempting to gauge her willingness to cooperate.\u003c/li&gt;\n\u003cli&gt;The conversation shifts towards the possibility of releasing the hobgoblin, but the group is conflicted about the risks involved.\u003c/li&gt;\n\u003cli&gt;Delwath presents the idea of using the hobgoblin to destabilize other hobgoblin forces, potentially creating a civil conflict.\u003c/li&gt;\n\u003cli&gt;Ultimately, the group decides against releasing her, fearing she could become a greater threat.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:44,&quot;title&quot;:&quot;Planning the Dragon Ambush&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;planning-the-dragon-ambush\&quot;&gt;Planning the Dragon Ambush\u003c/h3&gt;\n\u003cp&gt;The party strategizes on how to deal with a powerful dragon, debating whether to lure her out of her lair or face her directly inside.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The group considers using rumors or indirect messages to draw the dragon out of her lair, hoping to avoid a confrontation in her heavily fortified territory.\u003c/li&gt;\n\u003cli&gt;They weigh the risks of fighting the dragon outside versus inside her lair, and whether they should negotiate for the jade or prepare for a direct fight.\u003c/li&gt;\n\u003cli&gt;Ultimately, the party decides to prepare for both negotiation and combat, using stealth and misdirection to their advantage.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:47,&quot;title&quot;:&quot;Journey to the Dragon’s Lair&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;journey-to-the-dragons-lair\&quot;&gt;Journey to the Dragon’s Lair\u003c/h3&gt;\n\u003cp&gt;The party sets their plan into motion, transforming into animals and traveling to meet Ghesh in hopes of securing an audience with the dragon Ra’ghemdros.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The group transforms into fast-flying birds to approach Ghesh, using the disguise to maintain secrecy and build rapport with him.\u003c/li&gt;\n\u003cli&gt;Kenzo convinces Ghesh to help arrange a meeting with Ra’ghemdros, hinting that he has discovered something important in the western region that the dragon would want to know about, potentially involving treasure that could be rescued for Ra’ghemdros.&amp;nbsp;\u003c/li&gt;\n\u003cli&gt;Ghesh agrees to send a message to Ra’ghemdros, and three dragonettes are assigned to escort the party to the dragon’s lair. Kenzo jogs alongside the dragonettes, while the rest of the party travels in animal form.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:50,&quot;title&quot;:&quot;Audience with Ra’ghemdros&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;audience-with-raghemdros\&quot;&gt;Audience with Ra’ghemdros\u003c/h3&gt;\n\u003cp&gt;The party meets Ra’ghemdros, the powerful black dragon, in her lair amidst the ruins of an ancient villa of a lost Drankorian scholarly or magical society.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The party arrives at the thermal bath complex, where Ra’ghemdros is perched above, her massive pitch-black form marred by a scar shimmering in reds and oranges.\u003c/li&gt;\n\u003cli&gt;Ra’ghemdros begins by introducing herself: “I am Ra’ghemdros, daughter of Cha’mutte, I am the Light Stealer and the Final Shadow, the Devourer of Drankor, the Last Empress of Hkar, known as the Eternal Night and Enslaver of the Secret Sunset.”\u003c/li&gt;\n\u003cli&gt;Kenzo bows deeply and addresses her respectfully: “The Final Shadow. It is an honor to be in your presence and to have this audience.”\u003c/li&gt;\n\u003cli&gt;Ra’ghemdros acknowledges them and listens to Kenzo’s claim of having traveled to the western tower, her interest piqued. “Do you know of this place, the tower to the west?” Kenzo asks, to which she replies, “Of course. I know of everything in my domain.”\u003c/li&gt;\n\u003cli&gt;Ra’ghemdros expresses interest in what lies within the tower: “I would dearly love his throne, and I would be willing to trade. What is this you wish? The smallest trinket, a piece of jade?” Kenzo queries, “If I bring you his throne, you’d be willing to make that trade?” “Yes, I would”, Ra’ghemdros replies.&amp;nbsp;\u003c/li&gt;\n\u003cli&gt;When asked if they could obtain safe passage, Ra’ghemdros agrees but warns, “As soon as you take the jade, you must leave immediately. You will be no longer welcome. I would not have you lingering in my domain–I would not wish to draw Apollyon’s Eye.”\u003c/li&gt;\n\u003cli&gt;Ra’ghemdros also warns of Apollyon’s looming threat, stating, “All prisons fail…” while glancing at the nearby villa, which seems to be always at the forefront of her attention.&amp;nbsp;\u003c/li&gt;\n\u003cli&gt;The party discusses the logistics of retrieving the throne, weighing the use of magic or stealth to avoid detection and minimize conflict.\u003c/li&gt;\n\u003cli&gt;The group agrees that while Ra’ghemdros might seem cooperative, they must remain cautious and consider backup plans in case the negotiation fails or a trap is sprung.\u003c/li&gt;\n\u003cli&gt;She departs to her lair, after agreeing to meet the party back in 2 hours and granting them safe passage in the meantime.&amp;nbsp;\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:53,&quot;title&quot;:&quot;Scouting the Villa and Returning to Ra’ghemdros&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;scouting-the-villa-and-returning-to-raghemdros\&quot;&gt;Scouting the Villa and Returning to Ra’ghemdros\u003c/h3&gt;\n\u003cp&gt;With two hours until their next meeting with Ra’ghemdros, the party decides to explore the nearby villa to gather more information.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;They send a rat ahead to explore the ruins, discovering a cellar guarded by floating columns of acid and a large room with magical flames and statues depicting elegantly dressed individuals.\u003c/li&gt;\n\u003cli&gt;They use clairvoyance to investigate further, discovering a crypt lined with urns and a wall bearing a symbol of a flaming red eye surrounded by shadows.\u003c/li&gt;\n\u003cli&gt;The party discusses their findings, theorizing that the villa may contain hidden dangers or clues related to Cha’mutte and his connection to Ra’ghemdros.\u003c/li&gt;\n\u003cli&gt;After completing their scouting, the group returns to Ra’ghemdros with the throne, which they had retrieved earlier from the western tower.\u003c/li&gt;\n\u003cli&gt;Kenzo addresses Ra’ghemdros: “Ra’ghemdros Light Stealer, Final Shadow, Devourer of Drakor, the Last Empress of Hkar, and the Eternal Night, we bring to you your new throne.”\u003c/li&gt;\n\u003cli&gt;Ra’ghemdros takes the throne with clear satisfaction, declaring, “My servants, go forth and let it be known your Empress has a new throne.”\u003c/li&gt;\n\u003cli&gt;She rewards the party with the jade as promised, emphasizing that they must leave immediately, and dives back into her lair, holding the throne aloft for all to see.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:56,&quot;title&quot;:&quot;Confronting the Fiend in the Lava Chamber&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;confronting-the-fiend-in-the-lava-chamber\&quot;&gt;Confronting the Fiend in the Lava Chamber\u003c/h3&gt;\n\u003cp&gt;The party teleports into a dangerous intersection, preparing for a confrontation with a fiend in a lava-filled chamber.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;After entering the villa using Dimension Door, the party appeared in a four-way intersection of the dungeon.\u003c/li&gt;\n\u003cli&gt;Delwath uses Ghostly Gaze to scout the room, revealing a hidden room in which a large fiend stands near a lava fountain, apparently on guard.\u003c/li&gt;\n\u003cli&gt;The party discusses positioning and tactics to avoid line effects from the fiend, identifying the threat as a balrog-like creature holding a whip and cloaked in shadow. They decide to use Scatter to teleport into the room, hoping to avoid Cha’mutte’s eye and enter the lava chamber without needing to find the secret door.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:59,&quot;title&quot;:&quot;Battle Against the Fiend&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;battle-against-the-fiend\&quot;&gt;Battle Against the Fiend\u003c/h3&gt;\n\u003cp&gt;The party engages in a fierce battle with a powerful fiend in the lava chamber, utilizing a mix of spells, attacks, and creative tactics.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;Seeker attempts to destroy a massive scrying mirror that connects to Ra’ghemdros’s lair but finds it too resilient to break easily. The mirror allows Ra’ghemdros to spy on them, and the party debates whether to destroy it or focus on the fiend.\u003c/li&gt;\n\u003cli&gt;The fiend, a balrog-like creature, retaliates with its fiery whip and multiple devastating attacks, focusing its ire on Delwath and his radiant sword.\u003c/li&gt;\n\u003cli&gt;Delwath delivers powerful strikes with his magical sword, which glows with radiant energy, preventing the fiend from regenerating its wounds. He uses smites to enhance his attacks, each strike unleashing bursts of radiant power that weaken the fiend, often scoring critical hits with his sword that seems eager to destroy the fiend. At one point, Delwath is pulled into the lava by the fiend’s whip, but he manages to escape, continuing to fight despite his injuries. One particularly notable critical hit caused Delwath’s sword to glow with an intense light, accompanied by a whispered Elvish chant, as the fiend recoiled in pain.\u003c/li&gt;\n\u003cli&gt;Kenzo uses his martial prowess and the Fist of Planar Power to deal significant damage, including psychic attacks that bypass the fiend’s resistances. He also uses Stunning Strike in an attempt to hinder the fiend, forcing it to use its legendary resistances to avoid being incapacitated.\u003c/li&gt;\n\u003cli&gt;The fiend demonstrates its formidable power, using legendary actions to strike at Delwath and others, targeting the party members with its whip and claw attacks. Despite the intense heat and damage, Delwath manages to stay in the fight, aided by healing spells from his allies.\u003c/li&gt;\n\u003cli&gt;Seeker summons a Clay Construct Spirit, which, along with the animated ladder, aids in attacking the fiend and diverting its attention. The construct and ladder both manage to land several hits, providing crucial support during the battle. The ladder even managed a critical hit, dealing significant force damage to the fiend, which momentarily disrupted its focus.\u003c/li&gt;\n\u003cli&gt;Wellby takes to the air, using his ranged attacks to target the fiend from above. He successfully blinds the fiend at one point, giving the party a temporary advantage and reducing the threat of its devastating attacks. Wellby also uses his position to support his allies, ensuring they can focus on dealing damage.\u003c/li&gt;\n\u003cli&gt;The fiend casts a Wall of Fire, attempting to separate the party and trap several members within its flames. The fire proves a constant threat, forcing the party to adapt their positioning throughout the fight.\u003c/li&gt;\n\u003cli&gt;The battle reaches a turning point when Kenzo uses Step of the Wind to rescue Delwath from the Wall of Fire, preventing further damage. Delwath, barely standing, channels all his remaining strength into a final series of attacks, delivering a devastating radiant strike that ultimately vanquishes the fiend. The fiend’s form dissipates, and the Wall of Fire disappears as its hold over the battlefield is broken.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:62,&quot;title&quot;:&quot;Aftermath in the Lava Chamber&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;aftermath-in-the-lava-chamber\&quot;&gt;Aftermath in the Lava Chamber\u003c/h3&gt;\n\u003cp&gt;With the fiend defeated, the party takes stock of their situation and the room.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The fiend’s body collapses, leaving behind only a large black iron key. The party recognizes it as similar to an item they found long ago, tied to Shemut’s Holy Symbol.\u003c/li&gt;\n\u003cli&gt;Seeker shakes hands with the Clay Construct before it reverts to a lump of clay, its purpose fulfilled. The ladder, excited to be useful and to finally have a chance to destroy a mirror, instead of protecting them, proceeds to smash the scrying mirror, shattering it into pieces.\u003c/li&gt;\n\u003cli&gt;Delwath, battered and burned, casts Prayer of Healing to help the party recover. They take a short rest, replenishing their resources and discussing their next steps.\u003c/li&gt;\n\u003cli&gt;The party investigates the room further. They discover ten books on a shelf that have survived numerous scorch marks. These books bear the symbol of an open book with a flame and stars, marking them as part of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Concordia Pyrae\u003c/span&gt;—a secret Drankorian society dedicated to understanding the magic of the Plane of Fire.\u003c/li&gt;\n\u003cli&gt;The books contain extensive research into the magic of the Plane of Fire, including transmutation magic and fire manipulation. Three of the books are a chronicle of events, detailing the history of the villa. These records indicate that the villa was once a major pilgrimage site in Drankor, and later a place where many wizards conducted research. The chronicles also describe the downfall of the island, including a war between Apollyon and Cha’mutte over possession of a prisoner, with the last entries warning of the island’s imminent destruction.\u003c/li&gt;\n\u003cli&gt;Using tremor sense, Seeker detects something vibrating beneath the lava pool. The party debates how to proceed, eventually deciding to try and remove the lava to uncover whatever lies beneath.\u003c/li&gt;\n\u003cli&gt;They devise a plan using performance of creation to create \u003cspan class=\&quot;tv-crosslink\&quot;&gt;adamantine\u003c/span&gt; shovels, which the ladder and clay construct use to begin shoveling lava. Realizing this will take too long, they decide to use Wall of Stone to displace the lava, creating a cofferdam to reduce the volume they need to clear.\u003c/li&gt;\n\u003cli&gt;Once the lava is partially displaced, Seeker uses Ghostly Gaze to look beneath and finds a portal at the bottom of the lava pool. The key found from the fiend seems to fit, and Delwath uses it to unlock the portal, revealing a shimmering darkness below—the gateway to their next challenge.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:65,&quot;title&quot;:&quot;Shadow Prison and the Rescue of Cloud Spinner&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;shadow-prison-and-the-rescue-of-cloud-spinner\&quot;&gt;Shadow Prison and the Rescue of Cloud Spinner\u003c/h3&gt;\n\u003cp&gt;The party passes through the portal into a small shadowy chamber, discovering a powerful artifact and a prisoner.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The chamber is a 20-foot square room with walls made of constantly shifting shadows. Four ropes of shadow hang from the corners, suspending a pale gray smoky crystal in the center of the room.\u003c/li&gt;\n\u003cli&gt;Through the crystal, they dimly see a woman with long hair, colored in brilliant reds and oranges, who seems to be in a suspended state, her chest rising and falling slowly.\u003c/li&gt;\n\u003cli&gt;Delwath attempts to cut the ropes of shadow holding the crystal, managing to partially sever them. The shadows retaliate, inflicting levels of exhaustion on the party members as they continue their efforts to break the bonds.\u003c/li&gt;\n\u003cli&gt;Kenzo and Delwath take turns attacking the shadow ropes, each time risking exhaustion as the shadows drain their strength and vitality. Despite the risks, they manage to sever all four ropes, releasing the crystal.\u003c/li&gt;\n\u003cli&gt;Once freed, the crystal remains floating in mid-air, heavy but unaffected by gravity. The party realizes they need to move the crystal out of the shadowy prison.\u003c/li&gt;\n\u003cli&gt;Seeker calls upon the animated ladder, which wraps itself around the crystal and slowly drags it out of the portal, back into the lava chamber. The ladder, immune to exhaustion, successfully transports the crystal to safety.\u003c/li&gt;\n\u003cli&gt;The party inspects the crystal closely and determines that it contains a powerful entity, known as Cloud Spinner. Unsure of how to release her, they decide to store the crystal in the portable hole for now, planning to deal with it later.\u003c/li&gt;\n\u003cli&gt;With the crystal secured, the party debates their next move, ultimately deciding to teleport to Dimitar’s tower to rest and recover, hoping to avoid any immediate retaliation from the dragon Ra’ghemdros.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:68,&quot;title&quot;:&quot;Arrival at Dimitar’s Tower and New Challenges&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;arrival-at-dimitars-tower-and-new-challenges\&quot;&gt;Arrival at Dimitar’s Tower and New Challenges\u003c/h3&gt;\n\u003cp&gt;After defeating the fiend and rescuing Cloud Spinner, the party teleports to Dimitar’s temple to rest.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;Upon arrival at the temple, the party is greeted by Dimitar, who steps out from behind a statue, initially defensive but calms once he recognizes the group.\u003c/li&gt;\n\u003cli&gt;The party informs Dimitar of their recent encounters, including breaking a century-old curse and the potential threat posed by an angered dragon, Ra’ghemdros.\u003c/li&gt;\n\u003cli&gt;They reveal the last piece of jade and mention the crystal containing Cloud Spinner, an ancient archfey imprisoned for millennia.\u003c/li&gt;\n\u003cli&gt;Dimitar expresses concern about the threat Ra’ghemdros poses, as the dragon may now scry the entire island to locate them.\u003c/li&gt;\n\u003cli&gt;The party debates their next steps, with Dimitar suggesting they rest in the tunnels beneath the temple for safety from any potential retaliation from Ra’ghemdros.\u003c/li&gt;\n\u003cli&gt;The group decides to take Dimitar’s advice, moving into the narrow tunnels to set up a watch and ensure they can rest without interference.\u003c/li&gt;\n\u003cli&gt;During the rest, they continue discussing their next move, strategizing about how to confront Ra’ghemdros and use the resources they have, including potentially creating a simulacrum of Delwath for added strength during the upcoming confrontation.\u003c/li&gt;\n\u003cli&gt;The scene closes with the party settling into the tunnels, preparing for whatever challenges lie ahead, knowing that Ra’ghemdros may be coming for them sooner rather than later.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:71,&quot;title&quot;:&quot;Preparing for the Dragon’s Attack&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;preparing-for-the-dragons-attack\&quot;&gt;Preparing for the Dragon’s Attack\u003c/h3&gt;\n\u003cp&gt;The party deals with an alarm spell going off during their rest and interrogates a pair of dragonettes to gather information, while strategizing for an upcoming confrontation with Ra’ghemdros.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The party takes time to rest and reflect at Dimitar’s tower, preparing themselves for what lies ahead, and experiencing the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;The Last Jade Vision\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;An alarm spell is triggered, alerting the party to an intruder during their rest.\u003c/li&gt;\n\u003cli&gt;The party climbs out of the tunnels and encounters two dragonettes keeping watch.\u003c/li&gt;\n\u003cli&gt;Delwath casts Tongues to interrogate the dragonettes, learning they are on the island to keep watch and report back.\u003c/li&gt;\n\u003cli&gt;The party decides to send the dragonettes back with a message for Ra’ghemdros, positioning themselves strategically.\u003c/li&gt;\n\u003cli&gt;Tilly and Milo, previously separated from the party, rejoin them with news of Ra’ghemdros and a group of dragonettes and chimeras approaching.\u003c/li&gt;\n\u003cli&gt;The party sends a message to Gashen and Megan, trying to convince them to help in the fight against Ra’ghemdros.\u003c/li&gt;\n\u003cli&gt;They strategize to recruit more dragonettes by promising rewards from the dragon’s hoard.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:74,&quot;title&quot;:&quot;Climbing the Tower and Preparing for Battle&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;climbing-the-tower-and-preparing-for-battle\&quot;&gt;Climbing the Tower and Preparing for Battle\u003c/h3&gt;\n\u003cp&gt;The party decides to climb up to the tower to investigate and prepare the lighthouse mechanism to aid in their upcoming battle with Ra’ghemdros.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The group climbs up to the top of the tower to inspect the lighthouse mechanism, hoping to use it as a beacon during their fight.\u003c/li&gt;\n\u003cli&gt;They discover that the crystal at the center of the lighthouse is damaged, with two facets broken and one misaligned.\u003c/li&gt;\n\u003cli&gt;Seeker manages to use Mending on the misaligned piece, and uses Performance of Creation to replace missing crystal chunks.\u003c/li&gt;\n\u003cli&gt;The lighthouse is partially repaired, but the light will only reach a few hundred feet, perhaps a little more, perhaps a little less. The light is intended to give them early warning of the dragon’s approach.\u003c/li&gt;\n\u003cli&gt;The party strategizes, deciding to use the light to get a few moment’s notice before Ra’ghemdros is within striking distance, allowing them to cast spells and prepare defenses.\u003c/li&gt;\n\u003cli&gt;They discuss their tactics, including splitting into a hiding group and an attacking group, with Seeker, Wellby, and Milo staying in cover while Delwath and Kenzo prepare for direct confrontation.\u003c/li&gt;\n\u003cli&gt;The party distributes potions and gear, including a Potion of Heroism for Kenzo, who will act as the primary attacker against Ra’ghemdros.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:77,&quot;title&quot;:&quot;Battle with Minions Before the Dragon Arrives&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;battle-with-minions-before-the-dragon-arrives\&quot;&gt;Battle with Minions Before the Dragon Arrives\u003c/h3&gt;\n\u003cp&gt;The party faces off against a wave of enemies—chimeras and dragonettes—before Ra’ghemdros makes its appearance.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;Four chimeras and thirteen dragonettes approach, moving quickly towards the party’s position.\u003c/li&gt;\n\u003cli&gt;The party positions themselves, using the lighthouse as a beacon, and distributes potions to prepare for the oncoming attack.\u003c/li&gt;\n\u003cli&gt;Seeker uses a Rune of Psychic Disruption to incapacitate one chimera, causing it to fall from the sky and take heavy damage.\u003c/li&gt;\n\u003cli&gt;Tilly casts Ice Storm to damage multiple chimeras and dragonettes, weakening their approach.\u003c/li&gt;\n\u003cli&gt;Wellby and Milo use their ranged attacks to target the chimeras, inflicting significant damage, while Kenzo prepares to engage in melee once they are closer.\u003c/li&gt;\n\u003cli&gt;The minions move closer each round, with the party coordinating their attacks to thin their numbers before the final confrontation with Ra’ghemdros.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:80,&quot;title&quot;:&quot;Battle with Ra’ghemdros&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;battle-with-raghemdros\&quot;&gt;Battle with Ra’ghemdros\u003c/h3&gt;\n\u003cp&gt;The party engages in an intense and chaotic battle with Ra’ghemdros, an ancient dragon determined to reclaim its territory.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;Ra’ghemdros begins the fight by turning visible and unleashing a breath weapon—a mixture of darkness and acid—hitting multiple party members, dealing significant damage to Delwath and Milo and destroying some constructs.\u003c/li&gt;\n\u003cli&gt;Delwath and Kenzo move into close range, while Seeker and Wellby use ranged attacks, trying to keep some distance.\u003c/li&gt;\n\u003cli&gt;The dragon shows its powerful breath weapon again, dealing a mix of necrotic and acid damage, forcing many saving throws. Milo’s evasion helps him mitigate much of the damage, but others aren’t as lucky.\u003c/li&gt;\n\u003cli&gt;Seeker summons a stone construct to attack the dragon directly, managing to keep it occupied while taking some hits. Kenzo, in his enlarged form, delivers a series of powerful blows.\u003c/li&gt;\n\u003cli&gt;The party takes turns positioning themselves strategically, staying spread out to avoid grouping targets for Ra’ghemdros’ attacks.\u003c/li&gt;\n\u003cli&gt;Tilly supports with healing spells and Ice Storms, while Delwath uses his magic to bolster the group’s defenses.\u003c/li&gt;\n\u003cli&gt;The dragon uses legendary actions, including turning incorporeal to gain resistance to all damage, making it hard for the party to deal consistent harm.\u003c/li&gt;\n\u003cli&gt;In response, the party focuses on wearing the dragon down through strategic use of spells and sheer persistence, gradually reducing its hit points.\u003c/li&gt;\n\u003cli&gt;Milo and Wellby focus on delivering precision strikes, targeting weak points, while Kenzo continues to deal significant melee damage, often leaping onto the dragon’s back to attack.\u003c/li&gt;\n\u003cli&gt;After an intense battle, with multiple party members getting injured, Ra’ghemdros’ health falls critically low, and Dimitar seizes the opportunity, casting a powerful 7th-level fireball, dealing a significant amount of damage.\u003c/li&gt;\n\u003cli&gt;Kenzo finishes the fight with a series of devastating strikes, bringing Ra’ghemdros down. The dragon collapses, its massive form crashing into the ground, ending the battle.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:83,&quot;title&quot;:&quot;Ra’ghemdros’ Hoard and Dimitaur’s Rule&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;raghemdros-hoard-and-dimitaurs-rule\&quot;&gt;Ra’ghemdros’ Hoard and Dimitaur’s Rule\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party witnesses an ongoing battle between dragonettes, with Dimitar using his booming voice to announce the death of Ra’ghemdros.\u003c/li&gt;\n\u003cli&gt;Dimitar proclaims himself the leader of Fakar and takes on a new title, the “Protector of the Forever Sunset.”\u003c/li&gt;\n\u003cli&gt;The party makes their way to the lair of Ra’ghemdros, carefully avoiding traps like acid geysers and shadowy tendrils.\u003c/li&gt;\n\u003cli&gt;The treasure hoard is revealed, organized meticulously like a museum, with countless items of jewelry, coins, and historical artifacts.\u003c/li&gt;\n\u003cli&gt;The acid waterfall guarding part of the treasure is dispelled, revealing a separate chamber with more valuable and magical items.\u003c/li&gt;\n\u003cli&gt;The party selects the most valuable treasures they can carry, including magic items and historical artifacts, while leaving Dimitar in charge of the hoard.\u003c/li&gt;\n\u003cli&gt;They install a magical eye in Dimitar’s throne to maintain surveillance of the treasure and then make their way back to the villa.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:85,&quot;title&quot;:&quot;Raw Notes&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;raw-notes\&quot;&gt;Raw Notes\u003c/h3&gt;\n\u003cp&gt;(begin: after a long rest, the next morning, May 20th in Taelgar)\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;talk to revaka; fairly useless, some argument about souls\u003c/li&gt;\n\u003cli&gt;debate how to approach Ra’ghemdros and get the jade\u003c/li&gt;\n\u003cli&gt;decide to offer trade, Kenzo pretending to have scouted Apollyon’s Tower and offer to teleport there and bring her treasure, and also insisting he has to meet outside lair because his magic won’t work if he leaves the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Material Plane\u003c/span&gt;\u003c/li&gt;\n\u003cli&gt;talk to Ghesh around 11 am to set up a meeting\u003c/li&gt;\n\u003cli&gt;ordered to attend an audience with Ra’ghemdros; dragonet escort arrives; Kenzo jogs while rest of party remains in animal forms\u003c/li&gt;\n\u003cli&gt;reach Ra’ghemdros around 2 pm for audience\u003c/li&gt;\n\u003cli&gt;speak with Ra’ghemdros who is haughty but nervously watching villa nearby\u003c/li&gt;\n\u003cli&gt;agree to trade Apollyon’s Throne for the jade\u003c/li&gt;\n\u003cli&gt;leave meeting, secretly scout villa (base of Concordia Pyrae) with a rat (Wellby), discover guards at the surface; rat dies to a flame trap; use clairvoyance, see Cha’mutte’s symbol\u003c/li&gt;\n\u003cli&gt;wait 2 hours; return at 4 pm to trade throne for jade, transformed into elephants to pull the throne\u003c/li&gt;\n\u003cli&gt;after trading, use dimension door to investigate villa; appear avoided Cha’mutte’s symbol\u003c/li&gt;\n\u003cli&gt;ghostly gaze (delwath) reveals fiend behind wall; use scatter to appear in combat; Delwath’s elven sword is vicious but the fiend focuses fire on Delwath and he is knocked unconscious before being saved by Kenzo (step of the wind) and Seeker (healing word), and then kills demon\u003c/li&gt;\n\u003cli&gt;explore, discover portal underneath pool of lava; displace lave of wall of stone and enter portal\u003c/li&gt;\n\u003cli&gt;leads to a shadow dimension of Cha’mutte where cloudspinner is imprisoned trapped in impenetrable gray crystal\u003c/li&gt;\n\u003cli&gt;shadow dimension drains vitality quickly\u003cbr&gt;\n(recording 3)\u003c/li&gt;\n\u003cli&gt;teleport back to Dimitaur’s lair, short rest as sun sets while Ra’ghemdros rages\u003c/li&gt;\n\u003cli&gt;prepare for battle, sending messages to Tilly and Milo who insist on joining\u003c/li&gt;\n\u003cli&gt;long rest hidden in Dimitaur’s tunnels\u003cbr&gt;\n(on Taelgar, May 21st)\u003c/li&gt;\n\u003cli&gt;around 1 am, as long rest finishes, find two dragonet scouts\u003c/li&gt;\n\u003cli&gt;spread word that any dragonets who turn on Ra’ghemdros will be rewarded when the battle is over and she is dead\u003c/li&gt;\n\u003cli&gt;milo and tilly join, strategize over the fight\u003c/li&gt;\n\u003cli&gt;fix lighthouse in center of island, use driftglobes to power light (Seeker performance of creation)\u003c/li&gt;\n\u003cli&gt;fight long battle against Ra’ghemdros and her minions; initially the minions attack, and then she appears, having been invisible, and wipes out several summoned allies with her breath\u003c/li&gt;\n\u003cli&gt;tide turns as kenzo and delwath turn on Ra’ghemdros, Seeker summons an 8th stone golem to fight on her back, and wellby draws the fire of hordes of minions\u003c/li&gt;\n\u003cli&gt;as kenzo kills Ra’ghemdros with a punch at her scar, the sky lights up with sunrise in all directions\u003c/li&gt;\n\u003cli&gt;party goes to lair to dish out treasure\u003c/li&gt;\n\u003cli&gt;dimitaur takes throne and is proclaimed new emperor of hkar\u003c/li&gt;\n\u003cli&gt;party stuffs as much treasure as can fit in the portable hole and then departs, sailing through the storm with milo and tilly to vindristjarna\u003c/li&gt;\n\u003cli&gt;milo and tilly take folding boat and sail off (journeying first back to Apporia to collect the rest of their crew, and then south again to explore)\u003c/li&gt;\n\u003cli&gt;party returns to vindristjarna where Risywnn is waiting, and prepares to face Apollyon\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false}]},{&quot;title&quot;:&quot;Dunmari Frontier - Session 120&quot;,&quot;label&quot;:&quot;Session 120 (DuFr) — Session · illustrated&quot;,&quot;kind&quot;:&quot;Session note&quot;,&quot;words&quot;:3625,&quot;headingCount&quot;:17,&quot;context&quot;:&quot;Dunmar Frontier · 12 August 1749 DR&quot;,&quot;sections&quot;:[{&quot;start&quot;:1,&quot;title&quot;:&quot;Opening&quot;,&quot;level&quot;:1,&quot;html&quot;:&quot;\u003cdiv class=\&quot;admonition info\&quot;&gt;\u003cp class=\&quot;admonition-title\&quot;&gt;The Revel in Emberwine: in which the party mingles at Sunwine Hall\u003c/p&gt;\n\u003cp&gt;\u003cem&gt;Featuring: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Seeker\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Delwath\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Wellby\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Riswynn\u003c/span&gt;\u003c/em&gt;\u003cbr&gt;\n\u003cem&gt;In the Feywild: Late Afternoon\u003c/em&gt;\u003cbr&gt;\n\u003cem&gt;In Taelgar: May 31, 1749 DR to June 7, 1749 DR\u003c/em&gt;\u003cbr&gt;\n\u003cem&gt;On Earth: Wednesday Mar 05, 2025\u003c/em&gt;\u003cbr&gt;\n\u003cem&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sunwine Hall\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Emberwine\u003c/span&gt;\u003c/em&gt;\u003c/p&gt;\n\u003c/div&gt;\n\u003cp&gt;The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dunmar Fellowship\u003c/span&gt; attends a celebration at \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sunwine Hall\u003c/span&gt;, in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Emberwine\u003c/span&gt;, gaining allies and information for their quest to restore the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cloudspinner\u003c/span&gt;.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:3,&quot;title&quot;:&quot;Session Info&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;session-info\&quot;&gt;Session Info\u003c/h2&gt;\n\u003ch3 id=\&quot;summary\&quot;&gt;Summary\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;The party arrives at \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sunwine Hall\u003c/span&gt;, joining a celebration led by \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Lord Soven\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kenzo\u003c/span&gt; communes with the lively nature of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Emberwine\u003c/span&gt;, sensing the strain in the celebration.\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Wellby\u003c/span&gt; encounters a cursed satyr, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Valeris\u003c/span&gt;, who must always speak the most brutally honest truth.\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Delwath\u003c/span&gt; duels \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Arendel\u003c/span&gt;, a renowned fey duelist, and gains respect despite his loss.\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Riswynn\u003c/span&gt; converses with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ismara\u003c/span&gt;, a scholar intrigued by their journey.\u003c/li&gt;\n\u003cli&gt;The party learns about the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Shrouded Archive\u003c/span&gt; and Cloudspinner’s keeps from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Count Vashan\u003c/span&gt;.\u003c/li&gt;\
