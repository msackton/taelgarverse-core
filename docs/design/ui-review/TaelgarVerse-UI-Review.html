that dot the distant slopes of this long extinct volcano. A spur of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mount Nera\u003c/span&gt; cuts south towards the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa River\u003c/span&gt;, which spreads into a wide estuary and fertile floodplain towards the coast to the west.\u003c/p&gt;\n\u003cp&gt;The bustle of the busy port on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;South Bank\u003c/span&gt; dominates the soundscape of the city - the cries of sailors, the crack and snap of rigging and sails being set, the creak of ships sailing on the morning tide. Downriver of the mercantile wharves rises the Arsenal’s inner mole, sealing off a separate naval basin whose slipways are hidden from prying eyes.\u003c/p&gt;\n\u003cp&gt;On the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;North Bank\u003c/span&gt; of the river, in the shadow of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mount Nera\u003c/span&gt;, weirs and waterworks are mixed with numerous short, squat buildings of black stone, emitting an acrid stench. These are the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;chalyte\u003c/span&gt; refineries, the source of much of Chardon’s wealth, the buildings where the dirty and dangerous work of turning the raw chalyte ore shipped from the north into precious fuel for the magical works of the city takes place. Few live by choice amongst the dirt and stench of these refineries, but this doesn’t stop the spread of slums along the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;North Bank\u003c/span&gt;, filled with those who have no other options, hemmed in by the chalyte works downriver, and the walled estates upriver, beyond the spur of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mount Nera\u003c/span&gt; that shelters the rich from the noise and stink of the refineries.\u003c/p&gt;\n\u003cp&gt;The vast arch of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;River Bridge\u003c/span&gt; provides the main route across the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa\u003c/span&gt;. Wide enough for four carts to pass abreast, and enchanted to rise as needed to allow ships to pass, steady foot traffic passes under the watchful eyes of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Praecanti Vigiles\u003c/span&gt; - traders, chalyte dealers, wizards and scholars, farmers with goods for market, and many more. Upriver, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chardon Bridge\u003c/span&gt; is used more by locals, farmers as well as the rich and powerful. Smaller, with a series of twelve arches, this bridge marks the height of navigation for tall-masted sailing ships, although riverboat traffic is frequent here.\u003c/p&gt;\n\u003cp&gt;The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;South Bank\u003c/span&gt;, where the bulk of the city lies, is dominated by the hundreds of towers of Chardon, concentrated in the south and east of the city, where the Great Library stands. But many other sights are spread across the city: the three great markets and dozens of smaller markets, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Imperial Palace\u003c/span&gt;, the Cathedral of the Eight, The Pillar of Victory, Haldir’s Tomb, the Hospital of the Mother’s Grace, as well as other churches, monuments, and palaces scattered across the skyline.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:11,&quot;title&quot;:&quot;History&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;history\&quot;&gt;History\u003c/h2&gt;\n\u003cp&gt;Chardon has grown by alternating periods of slow accretion and swift expansion. As one of the only major cities on the west coast that has never been conquered, Chardon has long been a beacon of safety during times of war and chaos.\u003c/p&gt;\n\u003ch3 id=\&quot;founding\&quot;&gt;Founding\u003c/h3&gt;\n\u003cp&gt;Conventionally, Chardonian scholars date the beginning of the city of Chardon to the construction of a small Drankorian fortress on the spur of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mount Nera\u003c/span&gt; in DR 609, during the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Western Wars\u003c/span&gt;, although given the protected harbor, rich natural resources, and easy climate, it is very likely that settlement in the area long predates the coming of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian Empire\u003c/span&gt;. Over the next 450 years, Chardon grew slowly, primarily through the influx of scholars and wizards curious about the secrets that \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mount Nera\u003c/span&gt; might hide.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;609 DR: Fort Chardon, on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa River\u003c/span&gt;, is constructed by \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian\u003c/span&gt; armies to protect a sheltered harbor.\u003c/li&gt;\n\u003cli&gt;644 DR: Chardon reaches a population of 1000 people, as a small settlement grows in the shadow of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mount Nera\u003c/span&gt;, primarily serving as a local market town and safe harbor along the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;688 DR: The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great Library\u003c/span&gt; is founded on the south bank of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa\u003c/span&gt; by the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sibylinites\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;732 DR: Chardon reaches a population of 2000 people as an influx of scholars and wizards drawn to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great Library\u003c/span&gt; settle on the south bank.\u003c/li&gt;\n\u003cli&gt;844 DR: With the population swelling, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chardon Bridge\u003c/span&gt; is constructed with Drankorian magic to link the growing academic and magical community to the port and military fortifications on the north bank.\u003c/li&gt;\n\u003cli&gt;939 DR: The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;University of Chardon\u003c/span&gt; is founded; the population of Chardon reaches 5000 people. The first stone walls are constructed, enclosing what is now \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Precinct IV\u003c/span&gt;.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3 id=\&quot;refuge-from-the-fall\&quot;&gt;Refuge from the Fall\u003c/h3&gt;\n\u003cp&gt;The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Fall of Drankor\u003c/span&gt; marked a major turning point in the history of Chardon. Many fleeing the destruction of the heartland of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian Empire\u003c/span&gt;, and especially many wizards and scholars, fled west and settled in Chardon. Though the major economic engine of the post-fall years was the growing mercantile empires to the west (in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Apporia\u003c/span&gt;) and the north (on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mawakel Peninsula\u003c/span&gt;), Chardon became a major center of learning and a convenient safe harbor through which the goods of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa River Valley\u003c/span&gt; flowed during these years.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;1059 DR: Large numbers of refugees fleeing the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;First Plague\u003c/span&gt; settle in Chardon, swelling the population to 20,000, with more arriving every year. The first timber wharves on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;South Bank\u003c/span&gt; are constructed. A wooden palisade is constructed to protect the rapidly growing population, enclosing much of what is now Precinct III, V, and VI. The defensive fortifications on the north bank are expanded.\u003c/li&gt;\n\u003cli&gt;1072 DR: The population of Chardon reaches 40,000 people. The wooden palisade is expanded and replaced with a stone wall.\u003c/li&gt;\n\u003cli&gt;1099 DR: The population of Chardon reaches 60,000 people. Many wooden wharves on the south bank are replaced and rebuilt with stone. Chardon is becoming a major market where grain from the fertile \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa River Valley\u003c/span&gt; is traded with merchants from the growing naval power of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cedrano\u003c/span&gt;.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:13,&quot;title&quot;:&quot;Founding&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;founding\&quot;&gt;Founding\u003c/h3&gt;\n\u003cp&gt;Conventionally, Chardonian scholars date the beginning of the city of Chardon to the construction of a small Drankorian fortress on the spur of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mount Nera\u003c/span&gt; in DR 609, during the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Western Wars\u003c/span&gt;, although given the protected harbor, rich natural resources, and easy climate, it is very likely that settlement in the area long predates the coming of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian Empire\u003c/span&gt;. Over the next 450 years, Chardon grew slowly, primarily through the influx of scholars and wizards curious about the secrets that \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mount Nera\u003c/span&gt; might hide.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;609 DR: Fort Chardon, on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa River\u003c/span&gt;, is constructed by \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian\u003c/span&gt; armies to protect a sheltered harbor.\u003c/li&gt;\n\u003cli&gt;644 DR: Chardon reaches a population of 1000 people, as a small settlement grows in the shadow of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mount Nera\u003c/span&gt;, primarily serving as a local market town and safe harbor along the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;688 DR: The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great Library\u003c/span&gt; is founded on the south bank of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa\u003c/span&gt; by the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sibylinites\u003c/span&gt;.\u003c/li&gt;\n\u003cli&gt;732 DR: Chardon reaches a population of 2000 people as an influx of scholars and wizards drawn to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great Library\u003c/span&gt; settle on the south bank.\u003c/li&gt;\n\u003cli&gt;844 DR: With the population swelling, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chardon Bridge\u003c/span&gt; is constructed with Drankorian magic to link the growing academic and magical community to the port and military fortifications on the north bank.\u003c/li&gt;\n\u003cli&gt;939 DR: The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;University of Chardon\u003c/span&gt; is founded; the population of Chardon reaches 5000 people. The first stone walls are constructed, enclosing what is now \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Precinct IV\u003c/span&gt;.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:16,&quot;title&quot;:&quot;Refuge from the Fall&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;refuge-from-the-fall\&quot;&gt;Refuge from the Fall\u003c/h3&gt;\n\u003cp&gt;The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Fall of Drankor\u003c/span&gt; marked a major turning point in the history of Chardon. Many fleeing the destruction of the heartland of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian Empire\u003c/span&gt;, and especially many wizards and scholars, fled west and settled in Chardon. Though the major economic engine of the post-fall years was the growing mercantile empires to the west (in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Apporia\u003c/span&gt;) and the north (on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mawakel Peninsula\u003c/span&gt;), Chardon became a major center of learning and a convenient safe harbor through which the goods of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa River Valley\u003c/span&gt; flowed during these years.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;1059 DR: Large numbers of refugees fleeing the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;First Plague\u003c/span&gt; settle in Chardon, swelling the population to 20,000, with more arriving every year. The first timber wharves on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;South Bank\u003c/span&gt; are constructed. A wooden palisade is constructed to protect the rapidly growing population, enclosing much of what is now Precinct III, V, and VI. The defensive fortifications on the north bank are expanded.\u003c/li&gt;\n\u003cli&gt;1072 DR: The population of Chardon reaches 40,000 people. The wooden palisade is expanded and replaced with a stone wall.\u003c/li&gt;\n\u003cli&gt;1099 DR: The population of Chardon reaches 60,000 people. Many wooden wharves on the south bank are replaced and rebuilt with stone. Chardon is becoming a major market where grain from the fertile \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chasa River Valley\u003c/span&gt; is traded with merchants from the growing naval power of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Cedrano\u003c/span&gt;.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:19,&quot;title&quot;:&quot;Growth of Industry&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;growth-of-industry\&quot;&gt;Growth of Industry\u003c/h3&gt;\n\u003cp&gt;Starting in the DR 1200s, the industrial might of Chardon begins to grow. It is during this era that the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;River Bridge\u003c/span&gt; is built, the paper mills become established on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;North Bank\u003c/span&gt;, and Chardon becomes known not just as a center of magical learning but a place of skilled craft as well.\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;1324 DR: The population of Chardon reaches 100,000. The walls are expanded and reconstructed, forming the current old city walls, enclosing Precincts I - VI.\u003c/li&gt;\n\u003cli&gt;1366 DR: The growing paper industry on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;North Bank\u003c/span&gt; necessitates extensive water works. The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mill Channel\u003c/span&gt; is constructed.\u003c/li&gt;\n\u003cli&gt;1374 DR: The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;River Bridge\u003c/span&gt; is constructed to relieve traffic on river crossings.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:22,&quot;title&quot;:&quot;The Great War and the Blood Years&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;the-great-war-and-the-blood-years\&quot;&gt;The Great War and the Blood Years\u003c/h3&gt;\n\u003cp&gt;During the years before the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great War\u003c/span&gt;, Chardon was a major city, primarily known for the renown of its wizards. It emerged from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great War\u003c/span&gt; as the last bastion of safety on the west coast, despite nearly falling during the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Conclave War\u003c/span&gt;. During the years that followed, the population of Chardon swelled with refugees, the massive outer walls of the city were constructed, and the northern wall was built.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:24,&quot;title&quot;:&quot;Imperial Capital&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;imperial-capital\&quot;&gt;Imperial Capital\u003c/h3&gt;\n\u003cp&gt;Chardon emerged from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;War of the Dark Rift\u003c/span&gt; as the capital city of a small, and growing, empire, and the most significant maritime power on the west coast. During the years that followed, the economic might of Chardon grew dramatically, especially after the discovery of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;chalyte\u003c/span&gt; in the north in the late 1600s.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:26,&quot;title&quot;:&quot;Urban Geography&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;urban-geography\&quot;&gt;Urban Geography\u003c/h2&gt;\n\u003cp&gt;Chardon is organized into 21 administrative precincts, as well as a number of unincorporated suburbs south of the city.\u003c/p&gt;\n\u003cp&gt;Precincts I - VII are the inner core of the original Drankorian city, and are enclosed by the walls constructed during the expansion of the city in the 1300s. The modern port is largely congruent with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Precinct VI\u003c/span&gt;; the university district is \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Precinct IV\u003c/span&gt;; the imperial administrative center is in Precinct I.\u003c/p&gt;\n\u003cp&gt;Precincts VIII - XVI form the outer core of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;South Bank\u003c/span&gt;, numbered from VIII in the southwest to XVI in the northeast. Precinct VIII is adjacent to the naval arsenal; Precinct X houses the massive \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Kylos Market\u003c/span&gt;.\u003c/p&gt;\n\u003cp&gt;Precincts XVII - XXI are on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;North Bank\u003c/span&gt;; while Precincts XVIII and XIX are inside the north walls, XVII, XX, and XXI are the administrative units for the northern suburbs, with XVII containing the largest part of the chalyte refineries and the slums of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Riverside Quarter\u003c/span&gt;.\u003c/p&gt;\n\u003cp&gt;To the south of the city, extensive suburban development is not incorporated into the administrative precincts, and instead represents a patchwork of arrangements.\u003c/p&gt;\n\u003cp&gt;East of Mount Nera on the north bank, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Nera Domains\u003c/span&gt; are a collection of private estates and lordly manors of the rich and powerful.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:33,&quot;title&quot;:&quot;Trade and Economy&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;trade-and-economy\&quot;&gt;Trade and Economy\u003c/h2&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:34,&quot;title&quot;:&quot;Government&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;government\&quot;&gt;Government\u003c/h2&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:35,&quot;title&quot;:&quot;Key Organizations&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;key-organizations\&quot;&gt;Key Organizations\u003c/h2&gt;\n&quot;,&quot;truncated&quot;:false}]},{&quot;title&quot;:&quot;Addermarch&quot;,&quot;label&quot;:&quot;Addermarch — Realm · H2–H4&quot;,&quot;kind&quot;:&quot;Place&quot;,&quot;words&quot;:2766,&quot;headingCount&quot;:15,&quot;context&quot;:&quot;Modern · 29 June 1752 DR&quot;,&quot;sections&quot;:[{&quot;start&quot;:1,&quot;title&quot;:&quot;Opening&quot;,&quot;level&quot;:1,&quot;html&quot;:&quot;\u003cdiv class=\&quot;tv-metadata\&quot;&gt;\n\u003cul&gt;\n\u003cli&gt; A realm in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Greater Sembara\u003c/span&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/div&gt;\n\u003cp&gt;Nestled in the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mostreve Hills\u003c/span&gt; southwest of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt;, east of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Duchy of Maseau\u003c/span&gt;, south of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembaran Borderlands\u003c/span&gt;, and north of the haunted \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt; lies the ancient hill kingdom of Addermarch. This is a land of rolling hills, swift rivers, and dense forests; a rugged land of independent folk fiercely proud of their long history and ancient traditions.\u003c/p&gt;\n\u003cp&gt;Addermarch was settled long ago, before the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorians\u003c/span&gt; came, by a people sharing a cultural and linguistic tradition with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt;. During the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian Era\u003c/span&gt;, it was a backwater province of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian Empire\u003c/span&gt;, never densely settled, but supported and garrisoned as a ward against the dangers of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;.\u003c/p&gt;\n\u003cp&gt;With the fall of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankor\u003c/span&gt;, Addermarch charted its own course as a frontier kingdom, isolated from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembara\u003c/span&gt; by poor roads, difficult travel, and occasionally war. While sharing a language, a religion, and a cultural connection, Addermarch has never acknowledged the sovereignty of Sembaran or Tyrwinghan monarchs, excepting during the height of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;House of Sewick\u003c/span&gt; in the years leading to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great War\u003c/span&gt;.\u003c/p&gt;\n\u003cp&gt;Now, Addermarch is a land of small farmers, foresters, highland cattle, and sheepherders, known primarily for its famed apple brandy that is traded downriver into \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembara\u003c/span&gt;, but also a significant producer of timber, wool, and cheese. Addermarch has friendly relationships with the three human kingdoms on its borders: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembara\u003c/span&gt;, and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Maseau\u003c/span&gt;. Sembara is economically and culturally dominant in the region, and many merchant houses in Addermarch have close ties to traders and bankers in Sembara. But not all in Addermarch believe that Sembara will necessarily come to Addermarch’s aid, and a spirit of independence prevails in some circles.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:6,&quot;title&quot;:&quot;Geography&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;geography\&quot;&gt;Geography\u003c/h2&gt;\n\u003cp&gt;\u003cem&gt;See more: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mostreve Hills\u003c/span&gt;\u003c/em&gt;\u003c/p&gt;\n\u003cp&gt;Addermarch is a hill country, set entirely within the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mostreve Hills\u003c/span&gt;. The western parts of the kingdom are steep, rocky, and dominated by massive escarpments dropping to the Maseau plains and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Maseau Gap\u003c/span&gt;, while the central regions of the kingdom are a mix of rolling hills, forests, and small river valleys, the largest and most significant of which is the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt; valley. Addermarch itself is approximately 23,000 square miles.\u003c/p&gt;\n\u003ch3 id=\&quot;climate\&quot;&gt;Climate\u003c/h3&gt;\n\u003cp&gt;Most of Addermarch has hot and humid summers, with plenty of rain, and mild winters with relatively little snow. However, there is considerable variation, with the higher elevations frequently getting significant winter snowfall.\u003c/p&gt;\n\u003ch3 id=\&quot;regions\&quot;&gt;Regions\u003c/h3&gt;\n\u003cp&gt;Addermarch consists of four distinctive regions, each with their own culture and economy.\u003c/p&gt;\n\u003ch4 id=\&quot;western-highlands\&quot;&gt;Western Highlands\u003c/h4&gt;\n\u003cp&gt;\u003cem&gt;See more: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Carlinshire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Weskershire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Bramshire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt;\u003c/em&gt;\u003c/p&gt;\n\u003cp&gt;To the west and northwest, the rugged terrain of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt; tumbles down to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; river valley. This is a region of rough hills and mountains, which form high and often-impassable ramparts, especially on the western borders. It is also a region of productive, forested valleys, especially along the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt;; the lowlands near \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Valcroix\u003c/span&gt;, at the confluence of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Umber\u003c/span&gt;, are one of the major agricultural centers of Addermarch. The high meadows, though, are more isolated, cut off from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; by the dense \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Torvaine Forest\u003c/span&gt;, and are lightly populated by sheepherders and hardy farmers. This area was extensively fortified at multiple times in the past, but the castles in the hills have not all been maintained and many are now in ruins.\u003c/p&gt;\n\u003ch4 id=\&quot;aure-river-valley\&quot;&gt;Aure River Valley\u003c/h4&gt;\n\u003cp&gt;The heartlands of Addermarch are the Aure river valley. This is a land of gently rolling hills, open forests, and many small rivers and streams that flow from the surrounding highlands to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;. This region is the most densely settled of all of Addermarch, and includes the capital, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt;, which sits at the height of navigation of the Aure. The lower reaches of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt;, the two most important tributaries of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;, are also densely settled. To the north, the Aure crosses into the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembaran Borderlands\u003c/span&gt;. This region is the center of apple production in Addermarch, and well served by riverboat traffic along the Aure, which is navigable all the way from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt; to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Enst\u003c/span&gt;.\u003c/p&gt;\n\u003ch4 id=\&quot;southern-borderlands\&quot;&gt;Southern Borderlands\u003c/h4&gt;\n\u003cp&gt;\u003cem&gt;See more: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Shadowmere\u003c/span&gt;\u003c/em&gt;\u003c/p&gt;\n\u003cp&gt;South of Adderfell, the Aure runs swiftly from its source in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, and the wilds encroach. A line of gentle hills gradually climbs along the eastern banks of the Aure, beyond which the dense forest of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt; lies to trap the unwary. To the west, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mournebrook\u003c/span&gt; flows northeast from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Shadowmere\u003c/span&gt;, a haunted swamp on the western edge of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, and few dare cross its water south of its confluence with the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;. South of the river village of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tygate\u003c/span&gt;, this region is very lightly populated, mostly with smallholds of foresters and furriers. It is, however, well-defined: a line of fortifications watches the forest eaves (cf. \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood Keep\u003c/span&gt;) and runs along the hilltops to the east to watch for dangers from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Plaguelands\u003c/span&gt;.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:9,&quot;title&quot;:&quot;Climate&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;climate\&quot;&gt;Climate\u003c/h3&gt;\n\u003cp&gt;Most of Addermarch has hot and humid summers, with plenty of rain, and mild winters with relatively little snow. However, there is considerable variation, with the higher elevations frequently getting significant winter snowfall.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:11,&quot;title&quot;:&quot;Regions&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;regions\&quot;&gt;Regions\u003c/h3&gt;\n\u003cp&gt;Addermarch consists of four distinctive regions, each with their own culture and economy.\u003c/p&gt;\n\u003ch4 id=\&quot;western-highlands\&quot;&gt;Western Highlands\u003c/h4&gt;\n\u003cp&gt;\u003cem&gt;See more: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Carlinshire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Weskershire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Bramshire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt;\u003c/em&gt;\u003c/p&gt;\n\u003cp&gt;To the west and northwest, the rugged terrain of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt; tumbles down to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; river valley. This is a region of rough hills and mountains, which form high and often-impassable ramparts, especially on the western borders. It is also a region of productive, forested valleys, especially along the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt;; the lowlands near \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Valcroix\u003c/span&gt;, at the confluence of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Umber\u003c/span&gt;, are one of the major agricultural centers of Addermarch. The high meadows, though, are more isolated, cut off from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; by the dense \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Torvaine Forest\u003c/span&gt;, and are lightly populated by sheepherders and hardy farmers. This area was extensively fortified at multiple times in the past, but the castles in the hills have not all been maintained and many are now in ruins.\u003c/p&gt;\n\u003ch4 id=\&quot;aure-river-valley\&quot;&gt;Aure River Valley\u003c/h4&gt;\n\u003cp&gt;The heartlands of Addermarch are the Aure river valley. This is a land of gently rolling hills, open forests, and many small rivers and streams that flow from the surrounding highlands to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;. This region is the most densely settled of all of Addermarch, and includes the capital, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt;, which sits at the height of navigation of the Aure. The lower reaches of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt;, the two most important tributaries of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;, are also densely settled. To the north, the Aure crosses into the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembaran Borderlands\u003c/span&gt;. This region is the center of apple production in Addermarch, and well served by riverboat traffic along the Aure, which is navigable all the way from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt; to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Enst\u003c/span&gt;.\u003c/p&gt;\n\u003ch4 id=\&quot;southern-borderlands\&quot;&gt;Southern Borderlands\u003c/h4&gt;\n\u003cp&gt;\u003cem&gt;See more: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Shadowmere\u003c/span&gt;\u003c/em&gt;\u003c/p&gt;\n\u003cp&gt;South of Adderfell, the Aure runs swiftly from its source in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, and the wilds encroach. A line of gentle hills gradually climbs along the eastern banks of the Aure, beyond which the dense forest of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt; lies to trap the unwary. To the west, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mournebrook\u003c/span&gt; flows northeast from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Shadowmere\u003c/span&gt;, a haunted swamp on the western edge of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, and few dare cross its water south of its confluence with the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;. South of the river village of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tygate\u003c/span&gt;, this region is very lightly populated, mostly with smallholds of foresters and furriers. It is, however, well-defined: a line of fortifications watches the forest eaves (cf. \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood Keep\u003c/span&gt;) and runs along the hilltops to the east to watch for dangers from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Plaguelands\u003c/span&gt;.\u003c/p&gt;\n\u003ch4 id=\&quot;eastern-highlands\&quot;&gt;Eastern Highlands\u003c/h4&gt;\n\u003cp&gt;To the east and northeast, along the borders of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt;, the poor soil of the hilly, rocky land keeps forests to sheltered valleys. This is largely rangeland: highland cattle graze in the high pastures in summer, and only in a few sheltered valleys do crops thrive. The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt; is the most significant river in this region, and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt; valley where most of the few people who live in this part of Addermarch settle. East of the headwaters of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt;, the land turns quickly rocky, hard to travel, and dangerous; north of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt;, the hills get quickly steeper. The Tyrwinghan borderlands is lightly settled by cattle herders who bring their herds to the high meadows to graze in the summer.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:13,&quot;title&quot;:&quot;Western Highlands&quot;,&quot;level&quot;:4,&quot;html&quot;:&quot;\u003ch4 id=\&quot;western-highlands\&quot;&gt;Western Highlands\u003c/h4&gt;\n\u003cp&gt;\u003cem&gt;See more: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Carlinshire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Weskershire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Bramshire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt;\u003c/em&gt;\u003c/p&gt;\n\u003cp&gt;To the west and northwest, the rugged terrain of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt; tumbles down to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; river valley. This is a region of rough hills and mountains, which form high and often-impassable ramparts, especially on the western borders. It is also a region of productive, forested valleys, especially along the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt;; the lowlands near \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Valcroix\u003c/span&gt;, at the confluence of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Umber\u003c/span&gt;, are one of the major agricultural centers of Addermarch. The high meadows, though, are more isolated, cut off from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; by the dense \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Torvaine Forest\u003c/span&gt;, and are lightly populated by sheepherders and hardy farmers. This area was extensively fortified at multiple times in the past, but the castles in the hills have not all been maintained and many are now in ruins.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:16,&quot;title&quot;:&quot;Aure River Valley&quot;,&quot;level&quot;:4,&quot;html&quot;:&quot;\u003ch4 id=\&quot;aure-river-valley\&quot;&gt;Aure River Valley\u003c/h4&gt;\n\u003cp&gt;The heartlands of Addermarch are the Aure river valley. This is a land of gently rolling hills, open forests, and many small rivers and streams that flow from the surrounding highlands to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;. This region is the most densely settled of all of Addermarch, and includes the capital, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt;, which sits at the height of navigation of the Aure. The lower reaches of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt;, the two most important tributaries of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;, are also densely settled. To the north, the Aure crosses into the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembaran Borderlands\u003c/span&gt;. This region is the center of apple production in Addermarch, and well served by riverboat traffic along the Aure, which is navigable all the way from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt; to the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Enst\u003c/span&gt;.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:18,&quot;title&quot;:&quot;Southern Borderlands&quot;,&quot;level&quot;:4,&quot;html&quot;:&quot;\u003ch4 id=\&quot;southern-borderlands\&quot;&gt;Southern Borderlands\u003c/h4&gt;\n\u003cp&gt;\u003cem&gt;See more: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Shadowmere\u003c/span&gt;\u003c/em&gt;\u003c/p&gt;\n\u003cp&gt;South of Adderfell, the Aure runs swiftly from its source in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, and the wilds encroach. A line of gentle hills gradually climbs along the eastern banks of the Aure, beyond which the dense forest of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt; lies to trap the unwary. To the west, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mournebrook\u003c/span&gt; flows northeast from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Shadowmere\u003c/span&gt;, a haunted swamp on the western edge of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, and few dare cross its water south of its confluence with the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;. South of the river village of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tygate\u003c/span&gt;, this region is very lightly populated, mostly with smallholds of foresters and furriers. It is, however, well-defined: a line of fortifications watches the forest eaves (cf. \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood Keep\u003c/span&gt;) and runs along the hilltops to the east to watch for dangers from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Plaguelands\u003c/span&gt;.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:21,&quot;title&quot;:&quot;Eastern Highlands&quot;,&quot;level&quot;:4,&quot;html&quot;:&quot;\u003ch4 id=\&quot;eastern-highlands\&quot;&gt;Eastern Highlands\u003c/h4&gt;\n\u003cp&gt;To the east and northeast, along the borders of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt;, the poor soil of the hilly, rocky land keeps forests to sheltered valleys. This is largely rangeland: highland cattle graze in the high pastures in summer, and only in a few sheltered valleys do crops thrive. The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt; is the most significant river in this region, and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt; valley where most of the few people who live in this part of Addermarch settle. East of the headwaters of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt;, the land turns quickly rocky, hard to travel, and dangerous; north of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt;, the hills get quickly steeper. The Tyrwinghan borderlands is lightly settled by cattle herders who bring their herds to the high meadows to graze in the summer.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:23,&quot;title&quot;:&quot;Borders&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;borders\&quot;&gt;Borders\u003c/h3&gt;\n\u003cp&gt;To the west and northwest Addermarch is bordered by the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt;, a series of sharp cliffs and dangerous terrain that separates the realm from the flat plains of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Duchy of Maseau\u003c/span&gt; to the west, and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembaran borderlands\u003c/span&gt; to the north. At the Aure, the high ridge of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt; is cut by the river, and on the eastern bank, the land is much lower. Here an ancient line of border stones running to \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Garn Tyrn\u003c/span&gt; demarcates the border with \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt;. These stones are said by some to be raised by Drankor, but they are marked with complex warnings in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sylvan\u003c/span&gt;, and many believe they have fey origins.\u003c/p&gt;\n\u003cp&gt;The eastern border is not marked, as the high terrain between Addermarch and Tyrwinghan is unpopulated. The gentler, forested slopes to the north and east are under the demesne of Tyrwinghan earls, and the drier, arid slopes to the south and west, the land of Addermarian earls.\u003c/p&gt;\n\u003cp&gt;To the south, Addermarch is bordered by the high ridge of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mostreve Hills\u003c/span&gt;, where the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt; arises, and then, to the southwest, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;. This border is carefully watched for fear of what might creep out in the shadows.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:27,&quot;title&quot;:&quot;History&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;history\&quot;&gt;History\u003c/h2&gt;\n\u003cp&gt;Addermarch was settled long ago, by a people closely related to the ancient Tyrwinghans. Before the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Downfall\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt; and Addermarch were part of a shared patchwork of petty kingdoms, settled in the highlands of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mostreve Hills\u003c/span&gt; above the great, ancient lizardfolk swamps of the lowlands. However, Addermarch is outside the boundaries of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Archfey Ethlenn\u003c/span&gt;’s influence, and as Tyrwingha grew closer to the fey, the fate of the two realms diverged.\u003c/p&gt;\n\u003cp&gt;After the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Downfall\u003c/span&gt;, as the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian Empire\u003c/span&gt; grew to the south, dark things also crept into the woods to the south, no longer guarded or watched so closely by the elves, and the great forests on the southern slopes of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mostreve Hills\u003c/span&gt; became known as the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;. The people of Addermarch built standing stones to protect against incursions from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Feywild\u003c/span&gt;, and watched their borders closely.\u003c/p&gt;\n\u003cp&gt;During this time, Addermarch is incorporated into the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankorian Empire\u003c/span&gt; as a minor province, and the city of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt; grows significantly, from a small village at the height of navigation of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt; to a substantial urban center. The Drankorians, too, fortify the southern borders, and keep a close watch on the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, but Addermarch remains lightly settled.\u003c/p&gt;\n\u003cp&gt;The fall of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Drankor\u003c/span&gt; is little noticed in Addermarch at first, although it soon becomes a dangerous time as the Drankorian wizards that once guarded against incursions from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt; slowly decline in number and effectiveness. During this time, as to the north the six duchies of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembara\u003c/span&gt; are becoming established, Addermarch, despite suffering a series of upheavals, develops many of the governance traditions that still guide the realm. In the DR 1300s, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Serpentine Wars\u003c/span&gt; bring the threat of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Dominion of Avatus\u003c/span&gt; to the western borders of Addermarch. The Maseau Escarpment and western Addermarch are heavily fortified, and much of western Addermarch is occupied for a time before Addermarian resistance drives Avatus back.\u003c/p&gt;\n\u003cp&gt;After a few decades of uneasy peace, the region shifts dramatically again when \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Avatus\u003c/span&gt; invades \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembara\u003c/span&gt; in the early 1400s. Addermarch is nearly completely surrounded, kept from defeat only by the valiant efforts of guerilla warbands fighting in the rough hills of the escarpment.\u003c/p&gt;\n\u003cp&gt;When \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Derik I\u003c/span&gt; marches at the head of the combined armies of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembara\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt;, the earls of Addermarch quickly join, and in support of the war establish \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Derik I\u003c/span&gt; as the overking of Addermarch. Over the next hundred years or so, a close relationship between Addermarch and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembara\u003c/span&gt; develops. While the earls of Addermarch never become vassals of the Sembaran crown, when \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Derik I\u003c/span&gt; dies, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Derik II\u003c/span&gt; is acknowledged as overking of Addermarch, a tradition that continues through the reigns of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Charlotte I\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Derik III\u003c/span&gt;. During the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great War\u003c/span&gt;, the armies of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembara\u003c/span&gt; and Addermarch fight together as one.\u003c/p&gt;\n\u003cp&gt;After the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Great War\u003c/span&gt;, Addermarch suffers during the chaos of the early part of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Blood Years\u003c/span&gt;. After Derik III’s death, neither \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Bertram I\u003c/span&gt; nor \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Jane of Tollen\u003c/span&gt; are  acknowledged as overking (in part because in Addermarch there is no real concept of regency, in part because they are seen as out of touch with the dangers of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Plaguelands\u003c/span&gt;), and Addermarch turns inward. The next forty years are a dark time, plagued with constant threats from the south.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:38,&quot;title&quot;:&quot;Places&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;places\&quot;&gt;Places\u003c/h2&gt;\n\u003cp&gt;Natural features include:\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt;, a significant escarpment running along the western and northwestern borders, steep hills, rough terrain, some relatively impassible mountain ridges here and sharp cliffs on the western border\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, to the south, haunted and fey-associated, colocated with the center of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Duskmire\u003c/span&gt; in the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Feywild\u003c/span&gt;\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Torvaine Forest\u003c/span&gt;, centered at mid and high elevations around the upper \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Umber\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt;, and stretching in places into the lowlands.\u003c/li&gt;\n\u003cli&gt;A region of higher mountains and alpine meadows that forms the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tyrwingha\u003c/span&gt; border\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Shadowmere\u003c/span&gt;, a boggy lowlands on the western edge of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt;, also considered haunted\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt; river valley, including the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;, which forms a lake + waterfall at \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt;, and its major tributaries the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; and the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Branth\u003c/span&gt;, each with their own tributaries.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;Settlements include:\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt;, the largest settlement and only city in Addermarch, at the height of navigation of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Aure\u003c/span&gt;, center of apple farming and brandy production\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Tygate\u003c/span&gt;, a small market town near the southern border\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Valcroix\u003c/span&gt;, a market town at the confluence of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Umber\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Velan\u003c/span&gt; rivers\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Roscombe\u003c/span&gt;, a market town in the northwestern highlands, near \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Torvaine Forest\u003c/span&gt;\u003c/li&gt;\n\u003cli&gt;\u003cspan class=\&quot;tv-crosslink\&quot;&gt;Brantor\u003c/span&gt;, a village near \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Roscombe\u003c/span&gt;\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:43,&quot;title&quot;:&quot;Life in Addermarch&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;life-in-addermarch\&quot;&gt;Life in Addermarch\u003c/h2&gt;\n\u003ch3 id=\&quot;culture-and-religion\&quot;&gt;Culture and Religion\u003c/h3&gt;\n\u003cp&gt;The people of Addermarch are, in many ways, like the people of southern Sembaran and Tyrwingha. They worship \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mos Numena\u003c/span&gt;, following the Sembaran customs to a large extent, and they speak Sembaran (with a southern dialect; unlike in Tyrwingha to the east, there are no lingering pockets of people speaking the ancient tongues, although ancient inscriptions in the Old Tollish script can be found).\u003c/p&gt;\n\u003cp&gt;The land is hard, especially in the hills and mountains, and the people of Addermarch are largely independent, insular, and self-sufficient. Travel is difficult, and the constant danger of the tricksy fey from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt; and other dangerous places keeps people on guard against strangers and unusual happenings. There are fewer \u003cspan class=\&quot;tv-crosslink\&quot;&gt;dwarves\u003c/span&gt; than one might expect, but more \u003cspan class=\&quot;tv-crosslink\&quot;&gt;elves\u003c/span&gt;, mostly from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Orenlas\u003c/span&gt;, and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;lizardfolk\u003c/span&gt;, mostly from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ozabal\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Latazaro\u003c/span&gt; swamps.\u003c/p&gt;\n\u003cp&gt;The population of Addermarch is very rural. There is only one significant city, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt;, and while small market towns (often fortified) dot the landscape, most people live in small villages or isolated homesteads.\u003c/p&gt;\n\u003ch3 id=\&quot;political-organization-justice-and-the-law\&quot;&gt;Political Organization, Justice, and the Law\u003c/h3&gt;\n\u003cp&gt;Addermarch is a feudal oligarchy, with power centralized in the hands of the Earl’s Court, composed of the five hereditary earls of Addermarch, whose claim to power traces back to ancient days. The Earl’s Court has, in times of danger, elected one of their own, or even an outsider, as the commander in chief of the army, and over time this role has been formalized into the High Lord of Addermarch, who serves as a kind of overking, and is allowed to style themselves Defender of the Realm.\u003c/p&gt;\n\u003cp&gt;Each earl functions as the monarch of a circuit, defined by the villages and towns in their demesne. Within this circuit, the Earl is responsible for administering justice and providing for the defense of their territory, and has the right to tax the labor of the land to provide for its upkeep. However, generally speaking there is no manorial feudalism in Addermarch. Instead, an Earl would typically appoint a knight of their court to serve as the lord of a particular castle or manor. However, there is no expectation that this title is inherited, and although there are often significant land holdings which provide rents for castle upkeep, the knights and castellans have no vassalage relationship with the commoners. Indeed, many villages, especially in the protected interior, have no manor, and often have a strong tradition of common land.\u003c/p&gt;\n\u003cp&gt;There are also a few hundred hereditary knights in Addermarch: while some of these are attached to possession of land holdings, often a manor, many others are, like earls, itinerant.\u003c/p&gt;\n\u003cp&gt;The five Earls of Addermarch are known as:\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The Earl of Adderfell, who, unlike other Earls, is the lord of the city of Adderfell (but includes some outlying villages in their demesne)\u003c/li&gt;\n\u003cli&gt;The Earl of Westcliff, whose circuit includes all of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt;, as well as parts of the upper Aure valley, especially on the western part of Addermarch. The Earl of Westcliff is the lord of three shires: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Bramshire\u003c/span&gt; (northern hills bordering \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembaran Borderlands\u003c/span&gt;), \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Carlinshire\u003c/span&gt; (northwestern hills, upper reaches of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Umber\u003c/span&gt;), \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Weskershire\u003c/span&gt; (West Cliff and south). These shires are each centered around major defenses on the western and northern border, and have hereditary lords.\u003c/li&gt;\n\u003cli&gt;The Earl of Southmarch, whose circuit includes the southern Aure.\u003c/li&gt;\n\u003cli&gt;The Earl of Aurenvale, whose circuit is largely in the Aure river valley, in particular the northern and eastern stretches, interdigitating with the Earl of the Westcliff in parts of the western Aure valley, and the Earl of High Tyrn in parts of the eastern Aure valley.\u003c/li&gt;\n\u003cli&gt;The Earl of High Tyrn, whose circuit includes the eastern part of the Aure river valley, and the highlands along the Tyrwinghan border.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;,&quot;truncated&quot;:true},{&quot;start&quot;:44,&quot;title&quot;:&quot;Culture and Religion&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;culture-and-religion\&quot;&gt;Culture and Religion\u003c/h3&gt;\n\u003cp&gt;The people of Addermarch are, in many ways, like the people of southern Sembaran and Tyrwingha. They worship \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Mos Numena\u003c/span&gt;, following the Sembaran customs to a large extent, and they speak Sembaran (with a southern dialect; unlike in Tyrwingha to the east, there are no lingering pockets of people speaking the ancient tongues, although ancient inscriptions in the Old Tollish script can be found).\u003c/p&gt;\n\u003cp&gt;The land is hard, especially in the hills and mountains, and the people of Addermarch are largely independent, insular, and self-sufficient. Travel is difficult, and the constant danger of the tricksy fey from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Darkwood\u003c/span&gt; and other dangerous places keeps people on guard against strangers and unusual happenings. There are fewer \u003cspan class=\&quot;tv-crosslink\&quot;&gt;dwarves\u003c/span&gt; than one might expect, but more \u003cspan class=\&quot;tv-crosslink\&quot;&gt;elves\u003c/span&gt;, mostly from \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Orenlas\u003c/span&gt;, and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;lizardfolk\u003c/span&gt;, mostly from the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Ozabal\u003c/span&gt; and \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Latazaro\u003c/span&gt; swamps.\u003c/p&gt;\n\u003cp&gt;The population of Addermarch is very rural. There is only one significant city, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Adderfell\u003c/span&gt;, and while small market towns (often fortified) dot the landscape, most people live in small villages or isolated homesteads.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:48,&quot;title&quot;:&quot;Political Organization, Justice, and the Law&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;political-organization-justice-and-the-law\&quot;&gt;Political Organization, Justice, and the Law\u003c/h3&gt;\n\u003cp&gt;Addermarch is a feudal oligarchy, with power centralized in the hands of the Earl’s Court, composed of the five hereditary earls of Addermarch, whose claim to power traces back to ancient days. The Earl’s Court has, in times of danger, elected one of their own, or even an outsider, as the commander in chief of the army, and over time this role has been formalized into the High Lord of Addermarch, who serves as a kind of overking, and is allowed to style themselves Defender of the Realm.\u003c/p&gt;\n\u003cp&gt;Each earl functions as the monarch of a circuit, defined by the villages and towns in their demesne. Within this circuit, the Earl is responsible for administering justice and providing for the defense of their territory, and has the right to tax the labor of the land to provide for its upkeep. However, generally speaking there is no manorial feudalism in Addermarch. Instead, an Earl would typically appoint a knight of their court to serve as the lord of a particular castle or manor. However, there is no expectation that this title is inherited, and although there are often significant land holdings which provide rents for castle upkeep, the knights and castellans have no vassalage relationship with the commoners. Indeed, many villages, especially in the protected interior, have no manor, and often have a strong tradition of common land.\u003c/p&gt;\n\u003cp&gt;There are also a few hundred hereditary knights in Addermarch: while some of these are attached to possession of land holdings, often a manor, many others are, like earls, itinerant.\u003c/p&gt;\n\u003cp&gt;The five Earls of Addermarch are known as:\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;The Earl of Adderfell, who, unlike other Earls, is the lord of the city of Adderfell (but includes some outlying villages in their demesne)\u003c/li&gt;\n\u003cli&gt;The Earl of Westcliff, whose circuit includes all of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Westcliff\u003c/span&gt;, as well as parts of the upper Aure valley, especially on the western part of Addermarch. The Earl of Westcliff is the lord of three shires: \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Bramshire\u003c/span&gt; (northern hills bordering \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Sembaran Borderlands\u003c/span&gt;), \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Carlinshire\u003c/span&gt; (northwestern hills, upper reaches of \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Umber\u003c/span&gt;), \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Weskershire\u003c/span&gt; (West Cliff and south). These shires are each centered around major defenses on the western and northern border, and have hereditary lords.\u003c/li&gt;\n\u003cli&gt;The Earl of Southmarch, whose circuit includes the southern Aure.\u003c/li&gt;\n\u003cli&gt;The Earl of Aurenvale, whose circuit is largely in the Aure river valley, in particular the northern and eastern stretches, interdigitating with the Earl of the Westcliff in parts of the western Aure valley, and the Earl of High Tyrn in parts of the eastern Aure valley.\u003c/li&gt;\n\u003cli&gt;The Earl of High Tyrn, whose circuit includes the eastern part of the Aure river valley, and the highlands along the Tyrwinghan border.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;Note these circuits are not strict lines on a map and often overlap, but each village is part of the domain of a single earl.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:55,&quot;title&quot;:&quot;Economy, Trade, and Foreign Relations&quot;,&quot;level&quot;:3,&quot;html&quot;:&quot;\u003ch3 id=\&quot;economy-trade-and-foreign-relations\&quot;&gt;Economy, Trade, and Foreign Relations\u003c/h3&gt;\n\u003cp&gt;Addermarch does not have major trade connections to elsewhere, despite being rich in raw materials. The largest export industry is brandy, which is produced by a number of brandy houses based in Adderfell, and exported down river to Sembaran and beyond.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false}]},{&quot;title&quot;:&quot;Voltara&quot;,&quot;label&quot;:&quot;Voltara — Settlement · map&quot;,&quot;kind&quot;:&quot;Place&quot;,&quot;words&quot;:780,&quot;headingCount&quot;:4,&quot;context&quot;:&quot;Modern · 29 June 1752 DR&quot;,&quot;sections&quot;:[{&quot;start&quot;:1,&quot;title&quot;:&quot;Opening&quot;,&quot;level&quot;:1,&quot;html&quot;:&quot;\u003cdiv class=\&quot;tv-metadata\&quot;&gt;\n\u003cul&gt;\n\u003cli&gt; A city in \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Greater Voltara\u003c/span&gt;, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Northern Provinces\u003c/span&gt;, the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Chardonian Empire\u003c/span&gt;, \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Greater Chardon\u003c/span&gt;\u003cbr&gt;\n Located in the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Northwest Coast\u003c/span&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/div&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:2,&quot;title&quot;:&quot;Overview&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;overview\&quot;&gt;Overview\u003c/h2&gt;\n\u003cp&gt;Voltara, the northernmost substantial settlement in the Chardonian Empire, is a walled town of maybe 2000 people. It is situated on a grassy lowland steppe east of the \u003cspan class=\&quot;tv-crosslink\&quot;&gt;Fiatara Mountains\u003c/span&gt;, primarily supported by a large mining industry in the nearby hills, which are rich in chalyte. The grasslands are fertile land, and sheep farming and agriculture are common in the Voltara hinterlands.\u003c/p&gt;\n\u003cp&gt;Access to the walled town itself is heavily restricted. However, a decent-sized settlement has grown up outside the walls, oriented around the needs of the traveling merchant caravans that regularly depart carrying ore, precious metals, and more valuable goods extracted from the mines. Here, you can find taverns and inns aplenty, as well as a thriving bazaar.\u003c/p&gt;\n\u003cp&gt;Inside the walls, Voltara is a rich city, made wealthy on the chalyte trade. It is also a new city, largely constructed over the past two generations, on the site of a sleepy frontier fort after the discovery of chalyte in the hills to the north. Many buildings are constructed of white marble, the streets are wide and clean, and the entire town has an air of opulence about it.\u003c/p&gt;\n&quot;,&quot;truncated&quot;:false},{&quot;start&quot;:6,&quot;title&quot;:&quot;Precincts&quot;,&quot;level&quot;:2,&quot;html&quot;:&quot;\u003ch2 id=\&quot;precincts\&quot;&gt;Precincts\u003c/h2&gt;\n\u003cp&gt;\u003cimg src=\&quot;data:image/webp;base64,UklGRsYnAABXRUJQVlA4ILonAAAQwwCdASraAdMBPpFGnkulo6KhojMqQLASCWdu/GPZUIBHKbI/t9cy9b/ZvRtrb+f4K4tHYVna/vnqY8wbxufUX5hfNs9HnoAf1j/X9bB6MHl1+y3/Z/+p6U+qk+N/77/YO4P/G/17/HfsD7V+Tb0X7ecdaJr8f+7v7j/A+1X9y/4X9t8R/zD+U/6vqBfjP8w/0n5oe+e8w55/fegF7SfWf+B/ePyp+E36P/nehH2r/5HuA+T/eb+pewB/QP7//6f8j7r/9p/9/9P5x/qv9qPgI/nP93/7v+O9tv//+2z90v///1/hr/an//jp/MzMzMzMv+Grb91A5Sh+7dI5wsPtaf4MnBcE3xmiJXk20yB9vAgYpTMzMzMzMzMzMzK1vntuJMcbAcn7c3CGqeUmcUmn/Kz2UvyeHCldBNwemCVEnIiWpYzMzMzMzMyc/X8oHz+OanNIKd/0k/TWud4IXm25dlTEgxOWNuPUaCZYq8qEgq/KHG5mZmZmZgIvRgtshV6OW/boxXUKrw3BeFemmoBoylunsS8p5Q21g6kkWIrhCBASNEREREQ4yQ2+rU8/Wv/5hb9h4dvotIiKKZee8U1UPKHktgBg0ZVw1zXQiHS93d3d29UpOwdn6wQgwVHvu7vPOP6L6r1fc9cnd3A9JBJ7oV34R9BkFiJdEWEQp+hiPy+Zlf//DjTDxf8RVV+TMxSjqXKtnT4jnLgh8aUhL6kXkl8uQoPxqUYfLhsSOfCVfZfj+rqkfko8GLDEtfAvU9UlvoFfi403cIjF9lA49gjmrd
