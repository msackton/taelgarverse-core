[data-design=atlas] .site-layout{grid-template-columns:245px minmax(0,1fr);grid-template-areas:"nav article" "toc article";grid-template-rows:360px 1fr;gap:28px 48px;max-width:1380px}[data-design=atlas] .navigation-slot{grid-area:nav;position:static;max-height:360px;border:0;background:var(--surface);padding:18px}[data-design=atlas] .article-column{grid-area:article;max-width:980px}[data-design=atlas] .contents-slot{grid-area:toc;border:0;border-top:2px solid var(--accent);padding:18px 8px}[data-design=atlas] .site-header{background:var(--surface)}[data-design=atlas] article h1{font-size:44px;border:0}[data-design=atlas] article h2{border-bottom:2px solid var(--line)}[data-design=atlas] article .map-image{width:100%}
[data-design=reader] .site-header{max-width:1150px;margin:auto}[data-design=reader] .site-layout{display:flex;flex-direction:column;max-width:850px;gap:20px;padding-top:22px}[data-design=reader] .navigation-slot,[data-design=reader] .contents-slot{position:static;width:100%;max-height:none;border:0;padding:0}[data-design=reader] .navigation-slot{order:0}[data-design=reader] .contents-slot{order:1;padding-bottom:18px;border-bottom:1px solid var(--line)}[data-design=reader] .article-column{order:2}[data-design=reader] .site-navigation>nav{max-height:360px;overflow:auto;background:var(--surface);padding:20px}[data-design=reader] .site-navigation>summary,[data-design=reader] .contents-slot summary{margin-bottom:0}[data-design=reader] .toc{padding:16px 20px;background:var(--surface);max-height:420px;overflow:auto}[data-design=reader] article{font-size:18px;line-height:1.8}[data-design=reader] article h1{font-size:44px;border:0}[data-design=reader] article h2{border:0;font-size:30px}
html[data-design=library]{--bg:#faf9f6;--surface:#f0eee9;--text:#34332f;--muted:#68665f;--line:#d9d6ce;--link:#715137;--accent:#8b7053;--soft:#eae3d8}html[data-design=library][data-theme=dark]{--bg:#21221f;--surface:#2b2d28;--text:#e7e5de;--muted:#b9b9ad;--line:#494b42;--link:#d6bc91;--accent:#bda785;--soft:#393a30}[data-design=library] .site-header{border-bottom:3px double var(--line)}[data-design=library] .brand{font-variant:small-caps;letter-spacing:1px}[data-design=library] article{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.8}[data-design=library] article h1{font-size:42px}[data-design=library] article h3,[data-design=library] article h4{font-family:system-ui,sans-serif;font-size:18px}[data-design=library] .grid.cards{font-family:system-ui,sans-serif;border:0;border-left:2px solid var(--accent);border-radius:0}[data-design=library] .site-layout{max-width:1400px;grid-template-columns:210px minmax(0,1fr) 180px}
dialog{color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;width:min(540px,90vw);padding:24px}dialog::backdrop{background:#0008}dialog h2{margin-top:0;font-size:20px}dialog ul{max-height:50vh;overflow:auto}dialog button{margin-top:10px}
@media(max-width:1100px){.site-layout,[data-design=modern] .site-layout,[data-design=library] .site-layout{grid-template-columns:190px minmax(0,1fr);grid-template-areas:"nav toc" "nav article";gap:24px}.navigation-slot{grid-area:nav}.article-column{grid-area:article}.contents-slot{grid-area:toc;position:static;border:0;border-bottom:1px solid var(--line);padding:0 0 16px;max-height:none}.contents-slot>details>summary{margin-bottom:0}.contents-slot .toc{max-height:300px;overflow:auto;padding-top:10px}.header-tools{gap:8px;flex-direction:column;align-items:flex-end}}
@media(max-width:720px){.review-tools{padding:14px 16px}.review-tools header{gap:8px}.review-tools label{margin:0;width:100%}.review-tools select{flex:1;min-width:0}.designs{gap:5px}.designs button{font-size:12px;padding:6px 8px}.site-header{padding:20px 18px;gap:16px;flex-direction:column;align-items:flex-start}.brand{font-size:27px}.header-tools{align-items:flex-start;width:100%;gap:12px;flex-direction:row;justify-content:space-between}.context{font-size:11px;max-width:55%}.site-layout,[data-design=modern] .site-layout,[data-design=atlas] .site-layout,[data-design=reader] .site-layout,[data-design=library] .site-layout{display:flex;flex-direction:column;padding:20px 18px 44px;gap:20px}.navigation-slot,[data-design=atlas] .navigation-slot{order:0;position:static;border:0;border-bottom:1px solid var(--line);padding:0 0 16px;max-height:none;width:100%;background:none}.site-navigation>nav{max-height:340px;overflow:auto;padding:12px}.site-navigation>summary{margin:0}.contents-slot,[data-design=modern] .contents-slot,[data-design=atlas] .contents-slot{order:1;width:100%;position:static;border:0;border-bottom:1px solid var(--line);padding:0 0 16px;background:none;border-radius:0}.article-column{order:2;max-width:100%}article{font-size:16px!important;line-height:1.7!important}article h1{font-size:34px!important}article h2{font-size:26px!important}article h3{font-size:20px!important}article img[align=right],article img[align=left],article .taelgar-image--aside{float:none;width:auto;display:block;max-height:480px;margin:16px auto}.site-footer{padding:16px 18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{.review-tools,.navigation-slot,.contents-slot,.header-tools,.site-footer{display:none!important}.site-layout{display:block!important;padding:0}.article-column{max-width:none}html{--bg:#fff;--text:#111;--link:#111}}
</style></head>
<body>
<section class="review-tools" aria-label="Design review controls"><header><strong>TaelgarVerse · design review</strong><label for="review-page">Page <select id="review-page"></select></label></header><div class="designs" role="group" aria-label="Design"><button data-design="classic" aria-pressed="true">1 · Classic Encyclopedia</button><button data-design="modern" aria-pressed="false">2 · Modern Codex</button><button data-design="atlas" aria-pressed="false">3 · Atlas Reference</button><button data-design="reader" aria-pressed="false">4 · Reader’s Edition</button><button data-design="library" aria-pressed="false">5 · Quiet Library</button></div><p id="design-description"></p></section>
<div id="site"><a class="skip-link" href="#article">Skip to article</a><header class="site-header"><a class="brand" href="#">TaelgarVerse</a><div class="header-tools"><span class="context" id="context"></span><label class="appearance" for="appearance">Appearance <select id="appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></div></header><div class="site-layout"><div class="navigation-slot" id="navigation"></div><main class="article-column"><div id="breadcrumbs"></div><article id="article" tabindex="-1"></article></main><aside class="contents-slot"><details id="contents" open><summary>On this page</summary><nav id="toc" aria-label="On this page"></nav></details></aside></div><footer class="site-footer"><span>TaelgarVerse</span><a href="#site">Back to top ↑</a></footer></div>
<dialog id="offline-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-content"></div><form method="dialog"><button>Close</button></form></dialog>
<script type="application/json" id="page-data">__PAGE_DATA__</script>
<script>
(() => {
 const pages=JSON.parse(document.getElementById('page-data').textContent),html=document.documentElement,picker=document.getElementById('review-page');
 const descriptions={classic:'Classic Encyclopedia — three columns, serif headings, compact facts, and familiar reference navigation.',modern:'Modern Codex — sans serif headings, more open spacing, green accents, and a quieter contents panel.',atlas:'Atlas Reference — a broad article column with navigation and contents on the left; more room for maps.',reader:'Reader’s Edition — one centered reading column, larger prose, and collapsible navigation and contents.',library:'Quiet Library — serif prose, warm neutral colors, restrained rules, and a scholarly feel.'};
 let observer;
 pages.forEach((page,i)=>picker.add(new Option(page.name,i)));
 function configurePanels(){document.querySelector('.site-navigation').open=!matchMedia('(max-width:720px)').matches&&html.dataset.design!=='reader';document.getElementById('contents').open=!matchMedia('(max-width:1100px)').matches&&html.dataset.design!=='reader';}
 function render(index,scroll=true){
  picker.value=String(index);const page=pages[Number(index)];
  document.getElementById('article').innerHTML=page.html;document.getElementById('navigation').innerHTML=page.navigation;document.getElementById('breadcrumbs').innerHTML=page.breadcrumbs;document.getElementById('toc').innerHTML=page.toc;
  document.querySelector('.contents-slot').hidden=!document.querySelector('#toc a');
  document.getElementById('context').textContent=`${page.context.label} · ${page.context.date} DR`;document.title=`${page.title} — TaelgarVerse design review`;configurePanels();
  if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{const visible=entries.find(e=>e.isIntersecting);if(visible)document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('active',a.hash==='#'+visible.target.id));},{rootMargin:'0px 0px -65% 0px'});document.querySelectorAll('#article :is(h2,h3,h4,h5,h6)').forEach(h=>observer.observe(h));
  if(scroll)window.scrollTo({top:0,behavior:'instant'});
 }
 picker.addEventListener('change',()=>render(picker.value));
 document.querySelectorAll('button[data-design]').forEach(button=>button.addEventListener('click',()=>{html.dataset.design=button.dataset.design;document.querySelectorAll('button[data-design]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('design-description').textContent=descriptions[button.dataset.design];configurePanels();}));
 const appearance=document.getElementById('appearance'),preference=matchMedia('(prefers-color-scheme:dark)');function setTheme(){html.dataset.theme=appearance.value==='system'?(preference.matches?'dark':'light'):appearance.value;}appearance.addEventListener('change',setTheme);preference.addEventListener('change',setTheme);matchMedia('(max-width:720px)').addEventListener('change',configurePanels);matchMedia('(max-width:1100px)').addEventListener('change',configurePanels);
 function dialog(title,content){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-content').replaceChildren(content);document.getElementById('offline-dialog').showModal();}
 document.getElementById('site').addEventListener('click',event=>{const link=event.target.closest('a');if(!link)return;const href=link.getAttribute('href');if(!href||!href.startsWith('/'))return;event.preventDefault();const url=new URL(href,'https://offline.invalid'),index=pages.findIndex(p=>url.pathname==='/page/'+p.slug);if(index>=0){render(index);if(url.hash)document.getElementById(decodeURIComponent(url.hash.slice(1)))?.scrollIntoView();}else{const p=document.createElement('p');p.textContent=`“${link.textContent.trim()}” is outside the seven pages bundled in this offline review. Use the Page selector above the site to explore the included pages.`;dialog('Page not included in this export',p);}});
 document.getElementById('site').addEventListener('submit',event=>{if(!event.target.matches('.nav-search'))return;event.preventDefault();const query=new FormData(event.target).get('q').trim().toLowerCase(),list=document.createElement('ul');pages.forEach((page,i)=>{if(page.name.toLowerCase().includes(query)||page.title.toLowerCase().includes(query)){const item=document.createElement('li'),button=document.createElement('button');button.textContent=page.title;button.addEventListener('click',()=>{document.getElementById('offline-dialog').close();render(i);});item.append(button);list.append(item);}});if(!list.children.length)list.textContent='No matching titles in the seven bundled pages.';dialog('Search this offline export',list);});
 document.getElementById('design-description').textContent=descriptions.classic;render(0,false);setTheme();
})();
</script></body></html>
