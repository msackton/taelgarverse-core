<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taelgar — zoom into Aveil</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;color:#263b35;background:#f5f4ee;font:14px system-ui,sans-serif}header{height:72px;display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid #c6cbbf}h1{font:24px Georgia,serif;margin:0}header p{margin:0;font-size:13px;color:#626d61}nav{height:55px;display:flex;gap:8px;align-items:center;padding:8px 18px}button{background:#fffdf8;border:1px solid #b0baae;border-radius:5px;padding:8px 12px;cursor:pointer;color:#263b35;font:inherit}button:hover{background:#e1e9dc}button:focus-visible{outline:3px solid #5273a0;outline-offset:2px}#map{height:calc(100dvh - 176px);min-height:300px;background:#f8f9fa}footer{height:49px;padding:9px 18px;font-size:12px;color:#586351;display:flex;gap:20px;align-items:center}#status{margin-left:auto;font-variant-numeric:tabular-nums}#error{color:#9e3e25}.regional-detail{transition:opacity 220ms linear}.region-label{font:14px Georgia,serif;background:#fffdf4;border:1px solid #728571;color:#244e3a;padding:5px 9px;white-space:nowrap;border-radius:3px}.leaflet-tooltip{font:14px Georgia,serif}.leaflet-popup-content p{margin:6px 0}a{color:#26587d}@media(max-width:650px){header{height:88px;display:block;padding:10px 14px}header p{margin-top:5px}nav{height:88px;flex-wrap:wrap;padding:7px}#map{height:calc(100dvh - 245px)}footer{height:69px;display:block;padding:7px 12px}#status{margin-left:0}h1{font-size:22px}}
</style>
<header><h1>Taelgar / zoom into Aveil</h1><p>World map → regional woodland detail, in one Leaflet view</p></header>
<nav aria-label="Map controls"><button id="world">World view</button><button id="aveil">Zoom to Aveil</button><button id="closer">Closer</button><button id="base">Compare world artwork</button><span id="status" role="status">World map</span></nav>
<div id="map" aria-label="Interactive world map with regional detail"></div>
<footer><span>Zoom in over Aveil to reveal the new forest artwork; zoom out to return.</span><span>Trial: woodland detail only.</span><span id="error" role="alert"></span></footer>
<script src="vendor/leaflet.js"></script><script src="detail-layer.js"></script><script src="trial.js"></script></html>
